# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# Security updates only: `open-pull-requests-limit: 0` disables version updates, while
# Dependabot still opens one grouped fix PR per ecosystem when an alert has a patched
# release. `schedule` is required by the schema; it only paces the disabled version updates.
# Not covered, so updated by hand (AGENTS.md "Pinned contracts" and the quarterly docs-freshness
# issue): routine package and Action releases, Dockerfile base images (no advisories exist for them),
# the `[tools]` pins in mise.toml plus mise.lock, the Helm chart versions in infra/helmfile.yaml,
# the image digests inside infra/k8s/**, and the Wolfi `apk` pins. Nothing auto-merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directories:
      - /
      - /agents/python
      - /infra/mlflow
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
