# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dependabot keeps the repository's pin-everything policy current instead of pinned-and-forgotten.
# It is native to GitHub and needs no token, no app install, and no self-hosted workflow.
#
# Dependabot does not support globs in `directory`, so each Go module gets its
# own entry. The root module exists only to pin the Hextra Hugo theme. `directories`
# (plural) does take globs, which is how the github-actions entry reaches the composite
# actions under .github/actions/ as well as the workflows.
#
# Nothing auto-merges. The offline gate cannot see model or protocol drift, so every update goes
# through the local validation playbook in docs 8.2. Releases.
#
# What Dependabot does NOT cover here, and is therefore updated by hand (see AGENTS.md "Pinned
# contracts" and the quarterly docs-freshness issue): the `[tools]` pins in mise.toml plus
# mise.lock, the Helm chart versions in infra/helmfile.yaml, the image digests inside
# infra/k8s/**, the vendored bundles in assets/js/vendor/versions.json, the ADK-owned client
# family in agents/go/go.mod, and the compatibility hold in tools/go.mod (the last two are
# ignored below, and the freshness report's "Hand-moved Go modules" table resolves that
# ignored family against proxy.golang.org so it still surfaces quarterly).
version: 2
updates:
  - package-ecosystem: github-actions
    # For this ecosystem `/` means .github/workflows plus a root action.yml and nothing
    # else, so the composite actions under .github/actions/ had no proposal path at all:
    # their mise-action and setup-buildx-action pins sat outside every update while the
    # eleven workflow copies of the same action moved. The single-star glob is deliberate
    # — `/.github/actions/*/action.yml` monitors nothing upstream, and `**` opens duplicate
    # pull requests — and it also covers composite actions added later, which naming the
    # two existing ones would not. The group below already spans directories, so this stays
    # one weekly batch.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /agents/go # the Go reference agent, its tests, and its go.mod tool directive
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # ADK Go owns this family. Minimal version selection resolves openai-go, genai, and
      # the OpenTelemetry pair from ADK's own module, so a pull request that moves one of
      # them alone either changes nothing or desynchronises the set — and ADK's telemetry
      # contract test in tools/internal/conventions pins the reviewed ADK version, so an
      # unreviewed ADK bump is red by construction. The four transitive holds this list
      # used to carry were retired when ADK Go v2.3.0 moved its own logs to the OTel
      # 1.45 / log 0.21 family; the family still moves as one, by hand, prompted by the
      # quarterly freshness report and validated by `agents/go` check + test.
      - dependency-name: github.com/openai/openai-go/v3
      - dependency-name: go.opentelemetry.io/otel*
      - dependency-name: google.golang.org/adk/v2
      - dependency-name: google.golang.org/genai
    groups:
      go-agent-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          # The same four as the ignore list above, restated as the batch boundary:
          # excluding a dependency from a group makes Dependabot open a separate pull
          # request for it rather than none, which is how five permanently red ones
          # accumulated before both lists existed.
          - "github.com/openai/openai-go/v3"
          - "go.opentelemetry.io/otel*"
          - "google.golang.org/adk/v2"
          - "google.golang.org/genai"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: / # the Hextra theme, consumed as a Hugo Module through the root go.mod
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      hugo-theme:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /evals # standalone black-box evaluation harness
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      evaluation-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /tools # native authoring, browser, and release tooling
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # Same mechanism as /agents/go above, one family down: chromedp owns cdproto, and
      # tools/go.mod records the ceiling as a structured
      # `// compatibility hold: owner=chromedp@<version> constraint=<pseudo-version suffix>`
      # comment. check:freshness reports MISMATCH — and CI fails — unless the pinned
      # cdproto pseudo-version still contains the recorded constraint AND chromedp itself
      # is still required at the recorded version. Dependabot rewrites the require line
      # but never the hold comment, so both single-module bumps it can open here are red
      # by construction: cdproto on its own breaks the constraint, chromedp on its own
      # breaks the owner version. They move by hand and together, prompted by the
      # quarterly freshness report's "Go module compatibility holds" table, and validated
      # by the real Chrome accessibility acceptance run the hold names as its validator.
      - dependency-name: github.com/chromedp/cdproto
      - dependency-name: github.com/chromedp/chromedp
    groups:
      repository-tool-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra/gcp # the optional GKE laboratory module, planned with OpenTofu
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # The 8.x google provider is a major: it changes resource schemas, and this
      # module's acceptance is `tofu test` plus a plan against a real project, which
      # nobody has re-run on 8.x. versions.tf records the same decision as `~> 7.42`.
      - dependency-name: hashicorp/google
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /agents/go # agent image build and distroless runtime stages
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    ignore:
      # The build stage's Go version is a coordinated pin: it must stay equal to the `go`
      # entry in the root mise.toml [tools] and to the `go` directive in every go.mod.
      # `mise run check:docs` compares this tag against mise.toml and against agents/go,
      # evals and tools; the root go.mod is the one copy no gate reads, so a hand bump
      # must not forget it. Patch is ignored alongside major and minor for that reason —
      # a Dockerfile-only patch bump is red by construction, which is exactly what PR #165
      # (1.26.6 -> 1.26.8-alpine) was. The toolchain moves by hand across all six files,
      # prompted by the quarterly freshness report's `go` row. Digest-only rebuilds of the
      # same tag still arrive, which is the part worth automating.
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    cooldown:
      default-days: 7
