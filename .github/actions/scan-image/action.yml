name: Scan a course image
description: Apply the pinned vulnerability, secret, and license policy to one image.
inputs:
  image:
    description: Local image reference to scan.
    required: true
runs:
  using: composite
  steps:
    - name: Select the repository tool manager
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false

    - name: Install the repository-pinned Trivy
      shell: bash
      run: mise install -y --locked trivy

    - name: Scan image vulnerabilities and secrets
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: >-
        trivy image --config trivy.yaml --scanners vuln,secret
        --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

    - name: Verify image licenses
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: >-
        trivy image --config trivy.yaml --scanners license
        --severity UNKNOWN,HIGH,CRITICAL --exit-code 1 "$IMAGE"
