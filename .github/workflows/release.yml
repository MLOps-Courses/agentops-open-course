# Release authority starts from protected main, never from an arbitrary tag.
# The workflow qualifies one explicit commit, preflights both images before any
# registry write, publishes immutable digest evidence, then creates the tag and
# release only after independent verification.
name: Release

# --8<-- [start:release-dispatch-authority]
on:
  workflow_dispatch:
    inputs:
      version:
        description: "v-prefixed SemVer already recorded in release metadata"
        required: true
        type: string
      sha:
        description: "Full protected-main commit SHA to qualify and release"
        required: true
        type: string
      freshness_evidence:
        description: "Closed recent audit as issue:<number>, or waiver:<reviewed reason>"
        required: true
        type: string
      eval_evidence:
        description: "Empty to require a successful Eval run, or waiver:<reviewed reason> for this release only"
        required: false
        default: ""
        type: string

permissions: {}
# --8<-- [end:release-dispatch-authority]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Checkout the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Qualify protected main and exact-SHA evidence
        env:
          GH_TOKEN: ${{ github.token }}
          FRESHNESS_EVIDENCE: ${{ inputs.freshness_evidence }}
          EVAL_EVIDENCE: ${{ inputs.eval_evidence }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          # An Eval waiver is explicit, single-line, reviewed, and recorded on the
          # release; an empty input keeps the model-backed evidence requirement.
          eval_waiver=""
          if [[ -n "$EVAL_EVIDENCE" ]]; then
            if [[ "$EVAL_EVIDENCE" == *$'\n'* || ! "$EVAL_EVIDENCE" =~ ^waiver:(.{24,500})$ ]]; then
              echo "::error::eval_evidence must be empty or waiver:<single-line reason of 24-500 characters>."
              exit 1
            fi
            eval_waiver="${BASH_REMATCH[1]}"
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SHA"
          python3 scripts/check_conventions.py release-metadata "$VERSION"

          freshness_arguments=()
          if [[ "$FRESHNESS_EVIDENCE" =~ ^issue:([1-9][0-9]*)$ ]]; then
            issue_number="${BASH_REMATCH[1]}"
            gh api \
              --header "Accept: application/vnd.github.full+json" \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
              > freshness-issue.json
            jq \
              --null-input \
              --rawfile text .github/ISSUE_TEMPLATE/docs-freshness.md \
              --arg context "$GITHUB_REPOSITORY" \
              '{text: $text, mode: "gfm", context: $context}' |
              gh api --method POST markdown --input - > freshness-template.html
            freshness_arguments+=(
              --issue-json freshness-issue.json
              --checklist-template-html freshness-template.html
            )
          fi
          python3 scripts/release_freshness.py \
            --evidence "$FRESHNESS_EVIDENCE" \
            --actor "$GITHUB_ACTOR" \
            --repository "$GITHUB_REPOSITORY" \
            "${freshness_arguments[@]}" \
            > freshness-evidence.json

          tag_state=missing
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            test "$(git cat-file -t "refs/tags/${VERSION}")" = tag
            test "$(git rev-list -n 1 "refs/tags/${VERSION}")" = "$SHA"
            tag_state=existing
          fi
          release_state=missing
          if release="$(
            gh release view "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName,url 2>/dev/null
          )"; then
            test "$(jq -r .tagName <<<"$release")" = "$VERSION"
            if [[ "$(jq -r .isDraft <<<"$release")" != true ]]; then
              echo "::error::${VERSION} is already published and immutable."
              jq -r .url <<<"$release"
              exit 1
            fi
            release_state=draft
          fi

          evidence='[]'
          for specification in \
            'CI|ci.yml|["push"]' \
            'Docs|docs.yml|["push"]' \
            'Scan|scan.yml|["push"]' \
            'Eval|eval.yml|["workflow_dispatch","schedule"]' \
            'Platform|platform.yml|["workflow_dispatch","schedule"]'; do
            IFS='|' read -r workflow workflow_file allowed_events <<<"$specification"
            if [[ "$workflow" == Eval && -n "$eval_waiver" ]]; then
              echo "::warning::Eval evidence waived for ${VERSION}: ${eval_waiver}"
              continue
            fi
            response="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&head_sha=${SHA}&status=completed&per_page=100"
            )"
            run="$(
              jq -cer \
                --arg path ".github/workflows/${workflow_file}" \
                --arg sha "$SHA" \
                --argjson allowed_events "$allowed_events" '
                  [
                    .workflow_runs[]
                    | select(.path == $path)
                    | select(.head_branch == "main" and .head_sha == $sha)
                    | select(.event as $event | $allowed_events | index($event))
                  ]
                  # run_attempt is scoped to one run id, so it cannot order
                  # independent dispatches. updated_at is global and advances
                  # when an older run is re-run.
                  | sort_by(.updated_at, .id)
                  | last
                ' <<<"$response"
            )" || {
              echo "::error::No completed ${workflow} run exists for ${SHA}."
              exit 1
            }
            conclusion="$(jq -r .conclusion <<<"$run")"
            if [[ "$conclusion" != success ]]; then
              echo "::error::Latest ${workflow} run for ${SHA} concluded ${conclusion}."
              jq -r .html_url <<<"$run"
              exit 1
            fi
            evidence="$(
              jq -c \
                --argjson run "$run" \
                --arg workflow "$workflow" '
                  . + [{
                    workflow: $workflow,
                    run_id: $run.id,
                    run_attempt: $run.run_attempt,
                    event: $run.event,
                    conclusion: $run.conclusion,
                    created_at: $run.created_at,
                    updated_at: $run.updated_at,
                    head_branch: $run.head_branch,
                    head_sha: $run.head_sha,
                    path: $run.path,
                    url: $run.html_url
                  }]
                ' <<<"$evidence"
            )"
          done

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SHA" \
            --arg release_state "$release_state" \
            --arg tag_state "$tag_state" \
            --arg version "$VERSION" \
            --arg qualified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson freshness "$(<freshness-evidence.json)" \
            --argjson workflows "$evidence" \
            --arg eval_waiver "$eval_waiver" \
            --arg actor "$GITHUB_ACTOR" \
            '{
              schema_version: 2,
              repository: $repository,
              sha: $sha,
              version: $version,
              existing: {
                annotated_tag: $tag_state,
                github_release: $release_state
              },
              qualified_at: $qualified_at,
              freshness: $freshness,
              evaluation_waiver: (
                if $eval_waiver == "" then null
                else {reason: $eval_waiver, actor: $actor}
                end
              ),
              workflows: $workflows
            }' > qualification.json

      - name: Preserve sanitized model and scorer lineage
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          # A waived release publishes the waiver in place of model lineage, so the
          # release states plainly that no model-backed evaluation qualified it.
          if jq -e '.evaluation_waiver != null' qualification.json >/dev/null; then
            jq '{kind: "waiver", repository, sha, version, evaluation_waiver}' \
              qualification.json > evaluation-evidence.json
            exit 0
          fi
          eval_run="$(
            jq -er '.workflows[] | select(.workflow == "Eval") | .run_id' qualification.json
          )"
          eval_run_attempt="$(
            jq -er '.workflows[] | select(.workflow == "Eval") | .run_attempt' qualification.json
          )"
          mkdir -p eval-artifact
          gh run download "$eval_run" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "eval-release-evidence-*" \
            --dir eval-artifact
          mapfile -t model_files < <(find eval-artifact -type f -name model.json -print | sort)
          mapfile -t verdict_files < <(find eval-artifact -type f -name verdict.json -print | sort)
          test "${#model_files[@]}" -eq 1
          test "${#verdict_files[@]}" -eq 1
          model_file="${model_files[0]}"
          verdict_file="${verdict_files[0]}"
          python3 scripts/release_evidence.py \
            --model "$model_file" \
            --verdict "$verdict_file" \
            --lock agents/python/uv.lock \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SHA" \
            --run-id "$eval_run" \
            --run-attempt "$eval_run_attempt" \
            > evaluation-evidence.json

      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification
          path: |
            qualification.json
            evaluation-evidence.json
          if-no-files-found: error
          retention-days: 7

  container-matrix:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout the qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Read the shared container matrix
        id: matrix
        run: echo "value=$(jq -c . scripts/container-matrix.json)" >> "$GITHUB_OUTPUT"

  preflight:
    needs: [qualify, container-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-matrix.outputs.value) }}
    steps:
      - name: Checkout the qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Resolve immutable build metadata
        id: metadata
        env:
          NAME: ${{ matrix.name }}
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Build the exact preflight image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.metadata.outputs.image }}:candidate-${{ inputs.sha }}
          build-args: |
            AGENT_SOURCE_COMMIT=${{ inputs.sha }}
            OCI_CREATED=${{ steps.metadata.outputs.created }}
            OCI_VERSION=${{ inputs.version }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.name }}.tar
          provenance: false
          sbom: false

      - name: Load, inspect, and runtime-smoke the built image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}:candidate-${{ inputs.sha }}
          NAME: ${{ matrix.name }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          docker load --input "${RUNNER_TEMP}/${NAME}.tar"
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          [[ -n "$user" && "${user%%:*}" != 0 ]]
          if [[ "$NAME" == agent ]]; then
            docker run --rm --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=128m \
              --tmpfs /app/state:rw,noexec,nosuid,size=128m,uid=10001,gid=10001 \
              --entrypoint python "$IMAGE" -c "$SMOKE"
          else
            docker run --rm --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=128m \
              --entrypoint python "$IMAGE" -c "$SMOKE"
          fi

          container="release-preflight-${NAME}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if [[ "$NAME" == agent ]]; then
            container_port=8080
            health_path=/healthz
            # Gemini is the default provider and fails closed without credentials.
            # The account-free marker profile builds the model client without
            # contacting a model; readiness checks runtime state, not inference.
            docker run --detach --name "$container" --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=128m \
              --tmpfs /app/state:rw,noexec,nosuid,size=128m,uid=10001,gid=10001 \
              --env AGENT_MODEL_PROVIDER=openai-compatible \
              --env AGENT_MODEL=qwen3:4b-instruct \
              --env OPENAI_BASE_URL=http://127.0.0.1:11434/v1 \
              --env OPENAI_API_KEY=local-ollama \
              --publish "127.0.0.1::${container_port}" \
              "$IMAGE" >/dev/null
          else
            container_port=5000
            health_path=/health
            docker run --detach --name "$container" --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=128m \
              --tmpfs /var/lib/mlflow:rw,noexec,nosuid,size=512m,uid=10002,gid=10002 \
              --publish "127.0.0.1::${container_port}" \
              "$IMAGE" >/dev/null
          fi
          host_port="$(
            docker port "$container" "${container_port}/tcp" |
              awk -F: 'NR == 1 { print $NF }'
          )"
          test -n "$host_port"
          ready=false
          for _ in {1..90}; do
            if curl -fsS "http://127.0.0.1:${host_port}${health_path}" >/dev/null; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container"
            exit 1
          fi
          cleanup
          trap - EXIT

      - name: Verify the MLflow runtime matches its dependency authority
        if: matrix.name == 'mlflow'
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}:candidate-${{ inputs.sha }}
        run: |
          expected="$(./scripts/mlflow-version.sh)"
          actual="$(docker run --rm --entrypoint python "$IMAGE" -c 'import mlflow; print(mlflow.__version__)')"
          test "$actual" = "$expected"

      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.metadata.outputs.image }}:candidate-${{ inputs.sha }}

      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.metadata.outputs.image }}:candidate-${{ inputs.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ matrix.name }}.sbom.spdx.json
          upload-artifact: false

      - name: Upload the exact preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-preflight
          path: |
            ${{ runner.temp }}/${{ matrix.name }}.tar
            ${{ runner.temp }}/${{ matrix.name }}.sbom.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [agent, mlflow]
    steps:
      # The local setup-buildx action lives in the repository, so check out the
      # qualified source before downloading artifacts into the clean workspace.
      - name: Checkout the qualified build helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false # this job pushes images, never Git refs

      - name: Download the preflight artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}-preflight
          path: artifact

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the exact preflight bytes by source SHA
        id: push
        env:
          NAME: ${{ matrix.name }}
          SHA: ${{ inputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${NAME}"
          docker load --input "artifact/${NAME}.tar"
          source_ref="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -Fx "${image}:candidate-${SHA}")"
          docker tag "$source_ref" "${image}:sha-${SHA}"
          docker push "${image}:sha-${SHA}"
          digest="$(
            docker buildx imagetools inspect "${image}:sha-${SHA}" \
              --format '{{json .Manifest}}' |
              jq -er .digest
          )"
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${image}@${digest}" > "${NAME}.source.digest.txt"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest and attach its SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.push.outputs.image }}
          NAME: ${{ matrix.name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --type spdxjson \
            --predicate "artifact/${NAME}.sbom.spdx.json" \
            "${IMAGE}@${DIGEST}"

      - name: Create signed SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Collect the durable supply-chain evidence
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          NAME: ${{ matrix.name }}
        run: |
          cp "artifact/${NAME}.sbom.spdx.json" "${NAME}.sbom.spdx.json"
          cp "$BUNDLE" "${NAME}.source.provenance.sigstore.json"

      - name: Upload source digest, SBOM, and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-source-supply-chain
          path: |
            ${{ matrix.name }}.source.digest.txt
            ${{ matrix.name }}.sbom.spdx.json
            ${{ matrix.name }}.source.provenance.sigstore.json
          if-no-files-found: error
          retention-days: 7

  promote:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the qualified index validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Download both qualified digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-source-supply-chain"
          merge-multiple: true
          path: assets

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote both qualified digests
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-promote.sh

      - name: Upload the reversible version-index evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-promotion
          path: |
            agent.digest.txt
            mlflow.digest.txt
          if-no-files-found: error
          retention-days: 7

  seal:
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [agent, mlflow]
    steps:
      - name: Download the source digest and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}-source-supply-chain
          path: assets/source

      - name: Download the reversible version-index evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-promotion
          path: assets/promotion

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve the public subject
        id: subject
        env:
          NAME: ${{ matrix.name }}
        run: |
          exact_ref="$(<"assets/promotion/${NAME}.digest.txt")"
          image="${exact_ref%@*}"
          digest="${exact_ref#*@}"
          [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "image=${image}" >>"$GITHUB_OUTPUT"

      - name: Sign the public digest and attach its exact SBOM
        env:
          EXACT_REF: ${{ steps.subject.outputs.image }}@${{ steps.subject.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          cosign sign --yes "$EXACT_REF"
          cosign attest --yes \
            --type spdxjson \
            --predicate "assets/source/${NAME}.sbom.spdx.json" \
            "$EXACT_REF"

      - name: Create signed SLSA provenance for the public digest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.subject.outputs.image }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          subject-version: ${{ inputs.version }}
          push-to-registry: true

      - name: Collect the public supply-chain evidence
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          NAME: ${{ matrix.name }}
        run: |
          cp "assets/promotion/${NAME}.digest.txt" "${NAME}.digest.txt"
          cp "assets/source/${NAME}.source.digest.txt" "${NAME}.source.digest.txt"
          cp "assets/source/${NAME}.sbom.spdx.json" "${NAME}.sbom.spdx.json"
          cp "$BUNDLE" "${NAME}.provenance.sigstore.json"

      - name: Upload the public digest, SBOM, and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-supply-chain
          path: |
            ${{ matrix.name }}.digest.txt
            ${{ matrix.name }}.source.digest.txt
            ${{ matrix.name }}.sbom.spdx.json
            ${{ matrix.name }}.provenance.sigstore.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: seal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        name: [agent, mlflow]
    steps:
      - name: Checkout the qualified index validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Download the recorded digest and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}-supply-chain
          path: assets

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the exact digest, tag, labels, signature, SBOM, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          ISSUER: https://token.actions.githubusercontent.com
          NAME: ${{ matrix.name }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          exact_ref="$(<"assets/${NAME}.digest.txt")"
          image="${exact_ref%@*}"
          digest="${exact_ref#*@}"
          source_ref="$(<"assets/${NAME}.source.digest.txt")"
          source_image="${source_ref%@*}"
          source_digest="${source_ref#*@}"
          test "$source_image" = "$image"
          resolved="$(
            docker buildx imagetools inspect "${image}:${VERSION}" \
              --format '{{json .Manifest}}' |
              jq -er .digest
          )"
          test "$resolved" = "$digest"
          source_image_file="${RUNNER_TEMP}/${NAME}.source-image.json"
          docker buildx imagetools inspect "$source_ref" \
            --format '{{json .Image}}' >"$source_image_file"
          index_file="${RUNNER_TEMP}/${NAME}.index.json"
          docker buildx imagetools inspect "${image}:${VERSION}" --raw \
            >"$index_file"
          python3 scripts/release_reconcile.py \
            --validate-index-only \
            --index "$index_file" \
            --source-image "$source_image_file" \
            --version "$VERSION" \
            --sha "$SHA" \
            --source-digest "$source_digest" \
            >/dev/null

          cosign verify \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity "$IDENTITY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$SHA" \
            "$exact_ref"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity "$IDENTITY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$SHA" \
            --output json \
            "$exact_ref" >verified-sbom-attestation.json
          python3 scripts/release_attestation.py \
            --attestations verified-sbom-attestation.json \
            --sbom "assets/${NAME}.sbom.spdx.json"

          provenance_policy=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            --source-digest "$SHA"
            --source-ref refs/heads/main
            --deny-self-hosted-runners
          )
          gh attestation verify "oci://${exact_ref}" \
            --bundle "assets/${NAME}.provenance.sigstore.json" \
            "${provenance_policy[@]}" >/dev/null
          gh attestation verify "oci://${exact_ref}" \
            --bundle-from-oci \
            "${provenance_policy[@]}" >/dev/null

          docker pull "$exact_ref"
          labels="$(docker image inspect --format '{{json .Config.Labels}}' "$exact_ref")"
          jq -e \
            --arg revision "$SHA" \
            --arg version "$VERSION" '
              ."org.opencontainers.image.created" != "1970-01-01T00:00:00Z" and
              ."org.opencontainers.image.documentation" == "https://agentops-open-course.fmind.dev/" and
              ."org.opencontainers.image.licenses" == "MIT" and
              ."org.opencontainers.image.revision" == $revision and
              ."org.opencontainers.image.source" == "https://github.com/MLOps-Courses/agentops-open-course" and
              ."org.opencontainers.image.version" == $version
            ' <<<"$labels" >/dev/null

          jq -n \
            --arg digest "$digest" \
            --arg image "$image" \
            --arg source_digest "$source_digest" \
            --arg tag "$VERSION" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              source_digest: $source_digest,
              version_index: "single signed source digest",
              signature: "verified",
              sbom_attestation: "verified and matches release asset",
              slsa_provenance: "verified from release bundle and OCI registry",
              oci_labels: "verified",
              verified_at: $verified_at
            }' > "${NAME}.verification.json"

      - name: Upload independent verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-verification
          path: ${{ matrix.name }}.verification.json
          if-no-files-found: error
          retention-days: 7

  reconcile:
    needs: [publish, promote, seal, verify, release]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      (
        needs.promote.result != 'success' ||
        needs.seal.result != 'success' ||
        needs.verify.result != 'success' ||
        needs.release.result != 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the qualified cleanup validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Download the qualified source digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-source-supply-chain"
          merge-multiple: true
          path: assets

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Remove only the reversible version indexes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release=
          release_state=unknown
          not_found_count=0
          lookup_error="${RUNNER_TEMP}/release-lookup.error"
          for attempt in {1..5}; do
            if release="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
                2>"$lookup_error"
            )"; then
              jq -e \
                --arg tag "$VERSION" '
                  .tag_name == $tag and
                  (.draft | type == "boolean")
                ' <<<"$release" >/dev/null
              if [[ "$(jq -r .draft <<<"$release")" == true ]]; then
                release_state=draft
              else
                release_state=published
              fi
              break
            fi
            if grep -Fq '(HTTP 404)' "$lookup_error"; then
              not_found_count=$((not_found_count + 1))
            else
              echo "::warning::Release lookup attempt ${attempt} failed."
              cat "$lookup_error" >&2
            fi
            ((attempt == 5)) || sleep 2
          done
          if [[ "$release_state" == unknown && "$not_found_count" == 5 ]]; then
            release_state=missing
          fi
          case "$release_state" in
          published)
            echo "::notice::${VERSION} is already published; preserving its verified image indexes."
            jq -r .html_url <<<"$release"
            exit 0
            ;;
          draft | missing) ;;
          *)
            echo "::error::Could not prove ${VERSION} is absent or still a draft; preserving every image index."
            exit 1
            ;;
          esac

          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          for name in agent mlflow; do
            source_ref="$(<"assets/${name}.source.digest.txt")"
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${name}"
            source_digest="${source_ref#*@}"
            test "${source_ref%@*}" = "$image"
            source_image_file="${RUNNER_TEMP}/${name}.source-image.json"
            docker buildx imagetools inspect "$source_ref" \
              --format '{{json .Image}}' >"$source_image_file"

            package="${repository}/${name}"
            encoded="$(jq -rn --arg package "$package" '$package | @uri')"
            index_file="${RUNNER_TEMP}/${name}.index.json"
            inspect_error="${RUNNER_TEMP}/${name}.inspect.error"
            registry_present=false
            registry_absent=false
            resolved_digest=
            for attempt in {1..10}; do
              if docker buildx imagetools inspect "${image}:${VERSION}" --raw \
                >"$index_file" 2>"$inspect_error" &&
                resolved_digest="$(
                  docker buildx imagetools inspect "${image}:${VERSION}" \
                    --format '{{json .Manifest}}' 2>>"$inspect_error" |
                    jq -er .digest
                )"; then
                registry_present=true
                break
              fi
              ((attempt == 10)) || sleep 2
            done
            expected_registry_absence="ERROR: ${image}:${VERSION}: not found"
            if [[ "$registry_present" == false ]] &&
              grep -Fqx -- "$expected_registry_absence" "$inspect_error"; then
              registry_absent=true
            fi

            versions_file="${RUNNER_TEMP}/${name}.versions.json"
            gh api --paginate --slurp \
              "/orgs/${owner}/packages/container/${encoded}/versions?per_page=100" \
              >"$versions_file"
            ownership_arguments=(
              --versions "$versions_file"
              --version "$VERSION"
              --sha "$SHA"
              --source-digest "$source_digest"
            )
            if [[ "$registry_present" == true ]]; then
              ownership_arguments+=(
                --index "$index_file"
                --source-image "$source_image_file"
                --resolved-digest "$resolved_digest"
              )
            elif [[ "$registry_absent" == true ]]; then
              ownership_arguments+=(--registry-absent)
            fi
            ownership="$(python3 scripts/release_reconcile.py "${ownership_arguments[@]}")"
            if [[ "$(jq -er .state <<<"$ownership")" == absent ]]; then
              echo "::notice::${image}:${VERSION} has no reversible version index."
              continue
            fi
            version_id="$(jq -er '.version_id | select(type == "number" and . > 0)' <<<"$ownership")"
            gh api \
              --method DELETE \
              "/orgs/${owner}/packages/container/${encoded}/versions/${version_id}"
          done

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout the qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Download qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-qualification
          path: assets

      - name: Download supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-supply-chain"
          merge-multiple: true
          path: assets

      - name: Download independent verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-verification"
          merge-multiple: true
          path: assets

      - name: Create the annotated tag and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            test "$(git cat-file -t "refs/tags/${VERSION}")" = tag
            test "$(git rev-list -n 1 "refs/tags/${VERSION}")" = "$SHA"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag --annotate "$VERSION" "$SHA" --message "Release ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi

          bare_version="${VERSION#v}"
          awk \
            -v heading="## [${bare_version}]" '
              index($0, heading) == 1 { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

          if existing_release="$(
            gh release view "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName,url 2>/dev/null
          )"; then
            test "$(jq -r .tagName <<<"$existing_release")" = "$VERSION"
            test "$(jq -r .isDraft <<<"$existing_release")" = true
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi

          # A resumed draft may contain a partial or manually-added asset set.
          # Rebuild that set from this run, then prove GitHub stored exactly the
          # bytes verified above before crossing the publication boundary.
          gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' |
            while IFS= read -r asset_name; do
              gh release delete-asset "$VERSION" "$asset_name" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            done
          gh release upload "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            assets/*
          expected_assets='[]'
          for asset in assets/*; do
            test -f "$asset"
            expected_assets="$(
              jq -c \
                --arg digest "sha256:$(sha256sum "$asset" | cut -d' ' -f1)" \
                --arg name "${asset##*/}" \
                '. + [{name: $name, digest: $digest}]' \
                <<<"$expected_assets"
            )"
          done
          assets_match=false
          for _ in {1..10}; do
            remote_assets="$(
              gh release view "$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets
            )"
            if jq -e \
              --argjson expected "$expected_assets" '
                [.assets[] | {name, digest}] | sort_by(.name)
                == ($expected | sort_by(.name))
              ' <<<"$remote_assets" >/dev/null; then
              assets_match=true
              break
            fi
            sleep 2
          done
          [[ "$assets_match" == true ]]

          # Publication is deliberately the final fallible command. A failure
          # before this point leaves a resumable draft and lets reconciliation
          # remove only the version indexes; success is the immutable boundary.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SHA"
          gh release edit "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          {
            echo "## Published ${VERSION}"
            echo
            echo "- Qualified commit: \`${SHA}\`"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
            echo "- Both images: exact digest, signature, SBOM, SLSA provenance, and OCI labels verified"
          } >> "$GITHUB_STEP_SUMMARY" || true
