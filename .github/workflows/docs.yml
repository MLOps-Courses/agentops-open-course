# Build the course documentation (Hugo) and publish it to GitHub Pages.
#
# `check:docs` is the gate and the build in one step: it runs the conventions checker
# over content/, builds the site with --panicOnWarning, and then re-reads the rendered
# output — including the 76 alias routes the course published before the Hugo permalink
# scheme. Whatever this job uploads has already passed that contract.
#
# The `build` and `deploy` job names are load-bearing: `build` is one of the required
# status checks on the main ruleset, and `deploy` is the single job the conventions
# checker permits to hold Pages deployment authority.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pages accepts one deployment at a time; two pushes to main would otherwise race.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned tool manager
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Restore documentation Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'tools/go.sum') }}
          restore-keys: |
            docs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install only the documentation toolchain
        run: |
          mise install -y --locked hugo-extended go
          GOFLAGS=-mod=readonly go mod download
          cd tools && mise run install && mise run build

      - name: Validate and build the site
        run: mise run check:docs

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.event.repository.has_pages }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.event.repository.has_pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Explain why deployment is skipped
        if: ${{ !github.event.repository.has_pages }}
        run: echo "::notice::Docs validated; Pages deployment is disabled for this repository."

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.event.repository.has_pages }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
