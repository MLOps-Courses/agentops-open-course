# Security scanning: history, source, infrastructure, dependencies, images, and licenses.
# One workflow, two cadences. The scanners answer "is the current tree safe?" on
# every push, pull request, and week; the docs freshness report answers "did the
# world move under our pinned claims?" once a quarter. They share a file because
# they share a question — what upstream reality invalidates this repository — and
# `github.event.schedule` names which cron fired, so neither cadence runs the other.
name: Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — scanners
    - cron: "0 7 1 1,4,7,10 *" # 07:00 UTC on the first of Jan/Apr/Jul/Oct — quarterly freshness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-matrix:
    if: github.event.schedule != '0 7 1 1,4,7,10 *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the shared container matrix
        id: matrix
        run: echo "value=$(jq -c . scripts/container-matrix.json)" >> "$GITHUB_OUTPUT"

  repository:
    if: github.event.schedule != '0 7 1 1,4,7,10 *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can inspect every commit
          persist-credentials: false

      - name: Install the pinned security tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Install only repository scanners
        run: mise install -y --locked gitleaks trivy

      - name: Scan history, dependencies, secrets, and infrastructure
        run: mise run secure

  containers:
    needs: container-matrix
    if: github.event.schedule != '0 7 1 1,4,7,10 *'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-matrix.outputs.value) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Go toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Build ${{ matrix.name }} image
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        run: |
          mise install -y --locked go
          source_identity="$(go -C tools run ./cmd/source-identity --root .. --mode development)"
          docker build \
            --build-arg "AGENT_BUILD_MODE=development" \
            --build-arg "AGENT_SOURCE_COMMIT=$(jq -er .display <<<"$source_identity")" \
            --build-arg "AGENT_SOURCE_REVISION=$(jq -er '.revision // ""' <<<"$source_identity")" \
            --build-arg "AGENT_SOURCE_TREE_DIGEST=$(jq -er .tree_digest <<<"$source_identity")" \
            --build-arg "AGENT_SOURCE_DIRTY=$(jq -er .dirty <<<"$source_identity")" \
            --build-arg "OCI_CREATED=$(git show -s --format=%cI HEAD)" \
            --build-arg "OCI_VERSION=development" \
            --file "$DOCKERFILE" \
            --tag "$IMAGE" \
            "$CONTEXT"

      # The distroless image carries no interpreter and no shell, so the smoke is a
      # subcommand of the image's own entrypoint: config:check builds the same fail-fast
      # configuration every surface loads at startup and exits non-zero when it is invalid.
      - name: Smoke-test ${{ matrix.name }} image runtime
        env:
          IMAGE: ${{ matrix.image }}
          SMOKE: ${{ matrix.smoke }}
        run: docker run --rm "$IMAGE" "$SMOKE"

      - name: Scan ${{ matrix.name }} image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ matrix.image }}

  scan:
    name: scan
    # always() so a failed scanner still reports here, but the quarterly cadence
    # skips the scanners, so this summary must skip with them rather than read
    # their skipped results as failures.
    if: always() && github.event.schedule != '0 7 1 1,4,7,10 *'
    needs: [repository, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every scan passed
        env:
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$CONTAINERS_RESULT" = success

  # Quarterly read-only evidence for time-sensitive course claims. The reporter
  # never updates a pin or opens a pull request; it appends its Markdown to one
  # open freshness issue and deduplicates retries by workflow run id. A manual
  # dispatch runs it on demand — and, deliberately, the scanners with it.
  freshness-report:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 1 1,4,7,10 *') &&
      github.repository == 'MLOps-Courses/agentops-open-course'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure ephemeral report paths
        run: |
          {
            echo "MISE_CONFIG_DIR=${RUNNER_TEMP}/mise-config"
            echo "REPORT_DIR=${RUNNER_TEMP}/freshness-report"
            echo "REPORT_PATH=${RUNNER_TEMP}/freshness-report/report.md"
            echo "ISSUE_BODY_PATH=${RUNNER_TEMP}/freshness-report/issue-body.md"
          } >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/freshness-report"

      - name: Install the pinned mise resolver
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # The pinned action verifies this release against mise's signed SHASUMS.
          version: 2026.8.3
          install: false
          cache: false

      - name: Build the native freshness reporter
        run: |
          mise install -y --locked go
          cd tools
          mise run install

      - name: Run offline reporter fixtures
        run: mise run check:freshness

      - name: Generate the read-only freshness report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/bin/freshness-report --run-id "$GITHUB_RUN_ID" --output "$REPORT_PATH"

      - name: Prepare the issue template without its front matter
        run: |
          awk 'NR == 1 && /^---$/ { frontmatter = 1; next }
               frontmatter && /^---$/ { frontmatter = 0; next }
               !frontmatter' \
            .github/ISSUE_TEMPLATE/docs-freshness.md > "$ISSUE_BODY_PATH"

      - name: Upload the read-only report handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freshness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: error
          retention-days: 7

  # Separate job so only this one holds issue-write authority; the reporter that
  # reads upstream releases stays read-only.
  freshness-issue:
    needs: freshness-report
    if: needs.freshness-report.result == 'success' && github.repository == 'MLOps-Courses/agentops-open-course'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download the read-only report handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: freshness-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: report

      - name: Append the report to the idempotent freshness issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label documentation \
              --search "freshness audit in:title" \
              --limit 100 \
              --json number,title \
              --jq 'map(select(.title | startswith("docs: freshness audit"))) | sort_by(.number) | .[0].number // empty'
          )"

          if [[ -z "$issue_number" ]]; then
            month="$(date -u +%-m)"
            quarter="$(( (month - 1) / 3 + 1 ))"
            issue_url="$(
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "docs: freshness audit for $(date -u +%Y)-Q${quarter}" \
                --label documentation \
                --body-file report/issue-body.md
            )"
            issue_number="${issue_url##*/}"
            [[ "$issue_number" =~ ^[0-9]+$ ]]
          fi

          marker="<!-- freshness-report:${GITHUB_RUN_ID} -->"
          existing_comment="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              --jq ".[] | select(.body != null and (.body | contains(\"${marker}\"))) | .id"
          )"
          if [[ -n "$existing_comment" ]]; then
            echo "Freshness report for workflow run ${GITHUB_RUN_ID} is already attached to issue #${issue_number}."
            exit 0
          fi

          gh issue comment \
            "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file report/report.md
