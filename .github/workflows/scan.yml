# Security scanning: history, source, infrastructure, dependencies, images, and licenses.
name: Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the shared container matrix
        id: matrix
        run: echo "value=$(jq -c . scripts/container-matrix.json)" >> "$GITHUB_OUTPUT"

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can inspect every commit

      - name: Install the pinned security tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false

      - name: Install only repository scanners
        run: mise install gitleaks trivy

      - name: Scan history, dependencies, secrets, and infrastructure
        run: mise run secure

  containers:
    needs: container-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-matrix.outputs.value) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }} image
        env:
          VERSION: scan-${{ github.sha }}
        run: |
          docker build \
            --build-arg "AGENT_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "OCI_CREATED=$(git show -s --format=%cI HEAD)" \
            --build-arg "OCI_VERSION=${VERSION}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}" \
            "${{ matrix.context }}"

      - name: Smoke-test ${{ matrix.name }} image runtime
        run: docker run --rm --entrypoint python "${{ matrix.image }}" -c "${{ matrix.smoke }}"

      - name: Scan ${{ matrix.name }} image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ matrix.image }}

  scan:
    name: scan
    if: always()
    needs: [repository, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every scan passed
        env:
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$CONTAINERS_RESULT" = success
