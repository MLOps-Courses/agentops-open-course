# Security scanning: history, source, infrastructure, dependencies, images, and licenses.
name: Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can inspect every commit

      - name: Install the pinned security tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install only repository scanners
        run: mise install gitleaks trivy

      - name: Scan history, dependencies, secrets, and infrastructure
        run: mise run secure

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            context: agents
            dockerfile: agents/python/Dockerfile
            image: agentops-agent:scan
            smoke: "import asyncio; from agent.composition import root_agent; from agent.server import create_app; app = create_app(); assert root_agent.name == 'agentops_agent'; asyncio.run(app.state.runtime.close())"
          - name: mlflow
            context: infra/mlflow
            dockerfile: infra/mlflow/Dockerfile
            image: agentops-mlflow:scan
            smoke: "import mlflow"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }} image
        env:
          VERSION: scan-${{ github.sha }}
        run: |
          docker build \
            --build-arg "AGENT_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "OCI_CREATED=$(git show -s --format=%cI HEAD)" \
            --build-arg "OCI_VERSION=${VERSION}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}" \
            "${{ matrix.context }}"

      - name: Smoke-test ${{ matrix.name }} image runtime
        run: docker run --rm --entrypoint python "${{ matrix.image }}" -c "${{ matrix.smoke }}"

      - name: Scan ${{ matrix.name }} image vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          trivy-config: trivy.yaml
          version: v0.72.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Verify ${{ matrix.name }} image licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          trivy-config: trivy.yaml
          version: v0.72.0
          scanners: license
          severity: UNKNOWN,HIGH,CRITICAL
          exit-code: "1"

  scan:
    name: scan
    if: always()
    needs: [repository, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every scan passed
        env:
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$CONTAINERS_RESULT" = success
