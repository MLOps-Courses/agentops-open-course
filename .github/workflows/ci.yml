# Run the same quality gates used by local hooks. `mise run check` already builds
# and validates the documentation through check:source → check:docs, so this
# workflow also owns the one acceptance that cannot live inside `check`: the
# browser accessibility pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 5 * * 0" # weekly, before the Monday model-backed evaluation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve main evidence; only superseded pull-request runs are disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # The action's default `mise install` materializes every [tools] entry
          # plus anything in a runner's global config. The install tasks below pull
          # exactly the tiers CI needs, and nothing else.
          install: false

      # Both the module cache and the build cache: race-enabled tests otherwise
      # recompile all three module graphs for check and test.
      - name: Restore Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('agents/go/go.sum', 'evals/go.sum', 'tools/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Install project dependencies
        run: mise run install:validation

      - name: Verify the learner base doctor end to end
        run: mise run doctor

      - name: Format sources
        run: mise run format

      # The only network-permitted gate in the chain: `check` fans out to the
      # reachability-aware vulnerability audit for every Go module.
      # The hooks run `check:core` instead, which omits both so an offline commit still succeeds.
      - name: Run static checks
        run: mise run check

      # Fans out to the agent, evaluation, and repository-tool modules.
      - name: Run offline tests
        run: mise run test

      - name: Smoke-test the account-free host path
        run: mise run smoke:host

      # Both suites already run inside the aggregate; these dedicated steps make
      # red-team and evalset regressions named merge-gate signals.
      - name: Run the deterministic red-team suite
        run: mise run redteam

      - name: Validate the evalset against the seed data
        run: mise run eval:validate

      - name: Verify generated files are committed
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "::error::Working tree is dirty after install/format/check/test — a generated file is not committed."
            echo "$changed"
            git diff --stat
            git diff
            exit 1
          fi

  accessibility:
    name: Browser accessibility
    # `check:accessibility` is deliberately outside `check`: it drives a real Chrome
    # and needs the built site, so it stays its own job instead of slowing every
    # local `mise run check`. It builds the site itself, so it does not wait on
    # validate — a broken site fails here on its own, sooner and in parallel.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned tool manager
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Restore documentation Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: docs-accessibility-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'tools/go.sum') }}

      - name: Install only the documentation and browser toolchains
        run: |
          mise install -y --locked hugo-extended go golangci-lint dprint
          GOFLAGS=-mod=readonly go mod download
          cd tools
          mise run install
          cd ..
          mise run install:accessibility

      - name: Run the browser accessibility acceptance
        run: mise run check:accessibility

  critical-stability:
    name: Critical stability
    if: github.event_name == 'schedule' && github.repository == 'MLOps-Courses/agentops-open-course'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned tool manager
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      - name: Install the production Go test toolchain
        run: |
          mise install -y --locked go gotestsum
          cd agents/go
          mise run install

      - name: Repeat critical offline regressions without retries
        run: cd agents/go && gotestsum --format pkgname -- -race -count=5 ./a2aserver ./data ./policy ./state
