# The learning path, ordered by hand — the port of the `nav:` block in mkdocs.yml.
#
# This is deliberately NOT 74 `weight:` front-matter fields. Ordering scattered across the
# pages loses the property this file exists for: adding a page cannot silently reorder the
# course. Two things here are also inexpressible in Hugo's content tree, which is the other
# reason the nav stays a single hand-written file:
#
#   1. Cross-chapter prerequisites — "1.2. Container Engine" appears inside chapter 5 and
#      "1.3. Kubernetes" inside chapter 6, while both live in chapter 1.
#   2. The nested "Optional OSS maintenance" group inside chapter 8.
#
# `page` is the path under content/. `label` overrides the page title in the sidebar, and is
# used only for the two prerequisite entries. The native conventions navigation check
# fails the build when a page under content/ is missing here, or when an entry names a page
# that does not exist.

