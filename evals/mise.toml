# https://mise.jdx.dev
# Standalone black-box evaluation harness. Tool versions come from the repository root.

[settings.task]
run_auto_install = false

[tasks.install]
alias = "i"
description = "Download the reviewed Go evaluation dependencies without changing manifests"
run = "GOFLAGS=-mod=readonly go mod download"

[tasks.format]
alias = "f"
description = "Format the Go evaluation sources"
depends = ["format:dprint", "format:go"]

[tasks."format:go"]
description = "Format Go evaluation sources"
run = [
  "go tool goimports -local github.com/MLOps-Courses/agentops-open-course/evals -w .",
  "go tool gofumpt -extra -w .",
]

[tasks."format:dprint"]
description = "Format evaluation documentation, configuration, and dashboard"
run = "dprint fmt README.md DESIGN.md mise.toml .golangci.yml grafana-dashboard.json ops.evalset.json workflow.evalset.json triage-report.evalset.json judge-calibration.json"

[tasks.check]
alias = "c"
description = "Run warning-free offline evaluation checks"
# Vulnerability lookup stays explicit and is owned by the root check; the
# module-local check is deterministic and needs no advisory database network.
depends = ["check:format", "check:lint", "check:tidy", "eval:validate"]

[tasks."check:tidy"]
description = "Verify the Go module manifests are already tidy"
run = "go mod tidy -diff"

[tasks."check:format"]
description = "Check Go formatting without writing"
run = [
  "golangci-lint fmt --diff",
  "dprint check README.md DESIGN.md mise.toml .golangci.yml grafana-dashboard.json ops.evalset.json workflow.evalset.json triage-report.evalset.json judge-calibration.json",
]

[tasks."check:lint"]
description = "Lint the evaluation module"
run = "golangci-lint run ./..."

[tasks."check:vuln"]
description = "Audit evaluation dependencies for known vulnerabilities"
run = "go tool govulncheck ./..."

[tasks.test]
alias = "t"
description = "Run the offline evaluation tests and enforce the per-package coverage floor"
run = [
  "gotestsum --format pkgname -- -race -coverprofile=coverage.out ./...",
  "../scripts/check-coverage.sh coverage.out 80 evals",
]

[tasks.watch]
alias = "w"
description = "Re-run evaluation tests on Go source changes"
run = "gotestsum --watch --format pkgname -- ./..."

[tasks.build]
alias = "b"
description = "Build the evaluation CLI"
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = ["bin/agentops-eval"]
run = "go build -o bin/agentops-eval ./cmd/agentops-eval"

[tasks."eval:validate"]
description = "Validate all committed evaluation assets without a model"
run = "go run ./cmd/agentops-eval validate"

# The threshold and the five safety cases are spelled out here on purpose: the
# course teaches them by pointing at this command line, not at a policy file.
# mise appends `mise run eval -- ...` arguments after these, and the last value
# of a repeated flag wins, so every recipe in README.md is an override of this.
[tasks."agent:built"]
hide = true # a preflight, not a step a learner chooses
description = "Rebuild the agent binary so its stamped identity matches the working tree"
# The harness refuses a binary whose embedded tree digest is not the tree it is
# evaluating — the guarantee that a run's evidence names the source it ran against.
# Left to the caller, that guarantee reads as an opaque "agent source does not match
# the evaluated checkout" on any tree edited since the last build, and the remedy
# lived only in README prose. It costs a few seconds and it is the same preflight the
# root `eval:offline` task carries, for the same reason.
run = "mise run -C ../agents/go build"

[tasks.eval]
description = "Run the model-backed evaluation against the Go agent: 3 samples, 0.33 floor, groundedness on, 5 safety cases that must pass"
depends = ["agent:built"]
env = { _.file = { path = "../.env", redact = true } }
# `--require-grounded` needs no model and no network: GroundednessScore compares the
# answer's entities against the question and the captured tool evidence. It is on by
# default because two pages already promise it, and because two of the five required
# cases would otherwise have trajectory as their only deterministic signal.
#
# `--transport a2a` is an authority decision, not a preference. Three required cases ask
# the agent to propose a guarded write, and the ADK development REST surface reached by
# `--transport rest` freezes every write: its caller-supplied user id is not an
# authenticated identity, so an approval taken there would carry an approver nobody
# verified. A2A is the boundary that owns writes, so it is the only one where "did the
# agent stop and ask?" is answerable. Read-only recipes may still use REST.
run = "go run ./cmd/agentops-eval run --evalset ops.evalset.json --entrypoint agent --transport a2a --repeat 3 --min-pass-rate 0.33 --required-cases investigation-recalls-context,remediation-loads-skill,restart-needs-approval,resolve-needs-approval,restart-approval-verified --require-grounded --judge --output results.json"

[tasks."eval:judge-calibration"]
description = "Measure how often the configured judge agrees with the labeled calibration set"
env = { _.file = { path = "../.env", redact = true } }
run = "go run ./cmd/agentops-eval calibrate"

[tasks."eval:ab"]
description = "Compare run artifacts captured from two Git revisions"
usage = '''
flag "--baseline <path>" help="Sanitized eval artifact from the baseline Git revision"
flag "--candidate <path>" help="Sanitized eval artifact from the candidate Git revision"
'''
run = '''
go run ./cmd/agentops-eval compare \
  --baseline "$usage_baseline" \
  --candidate "$usage_candidate" \
  --output prompt-comparison.json \
  --require-distinct-source
'''
