# https://mise.jdx.dev
# AgentOps reference agent — Python track tasks.
# Only configuration/model-backed tasks load the root .env; offline gates load no dotenv.

[tasks.install]
alias = "i"
description = "Install development dependencies (offline gates and the test suite)"
run = "uv sync --locked"

[tasks."install:eval"]
description = "Add the MLflow/rouge evaluation chain (~350 MB) needed by the eval:mlflow family"
run = "uv sync --locked --group eval"

[tasks.format]
alias = "f"
description = "Format Python source and imports"
run = "mise run format:python"

[tasks."format:python"]
description = "Sort imports and format with Ruff"
run = "uv run ruff check --select=I --fix --force-exclude . && uv run ruff format --force-exclude ."

[tasks.check]
alias = "c"
description = "Run the offline code checks in parallel"
# check:vuln is deliberately absent: pip-audit queries PyPI, and this chain runs on
# every commit. An offline commit must not fail. CI runs check:vuln as its own step.
depends = ["check:format", "check:lint", "check:types"]

[tasks."config:check"]
description = "Validate the resolved agent configuration and print it with secrets masked"
env = { _.file = { path = "../../.env", redact = true } }
run = "uv run python -m agent.config_check"

[tasks."check:format"]
alias = "cf"
description = "Check formatting and configuration"
run = [
  "uv run validate-pyproject pyproject.toml",
  "uv run ruff format --check .",
  "uv lock --check",
]

[tasks."check:lint"]
alias = "cl"
description = "Run the Ruff linter"
run = "uv run ruff check --force-exclude ."

[tasks."check:types"]
alias = "ct"
description = "Run the ty type checker"
run = "uv run ty check"

[tasks."check:vuln"]
alias = "ca"
description = "Audit dependencies for known vulnerabilities (needs network; CI-only gate)"
run = "uv run pip-audit"

[tasks.test]
alias = "t"
description = "Run the offline test suite with branch coverage"
run = "uv run pytest --cov=agent --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=95"

[tasks."test:critical"]
description = "Repeat state, policy, privacy, and portability regressions under fixed hash seeds"
run = """
for seed in 1 17 97; do
  PYTHONHASHSEED="${seed}" uv run pytest --no-cov \
    tests/test_state.py \
    tests/test_data.py \
    tests/test_retrieval.py \
    tests/test_server.py \
    tests/test_governance.py \
    tests/test_pii.py \
    tests/test_required_trajectory.py \
    tests/test_domain_portability.py
done
"""

[tasks.eval]
alias = "e"
description = "Run strict ADK cases and enforce the aggregate plus critical-case floors"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = """
uv run python evals/run_adk_eval.py evals/ops.evalset.json \
  --min-pass-rate 0.33 \
  --required-case investigation-recalls-context \
  --required-case remediation-loads-skill \
  --required-case restart-needs-approval \
  --required-case resolve-needs-approval
"""

[tasks."eval:report"]
description = "Validate the structured TriageReport path with the configured model"
env = { _.file = { path = "../../.env", redact = true } }
run = "uv run python -m evals.report_eval"

[tasks."eval:workflow"]
description = "Evaluate the bounded plan and evidence-review workflow with the configured model"
env = { AGENT_ENTRYPOINT = "workflow", _.file = { path = "../../.env", redact = true } }
run = "uv run python evals/run_adk_eval.py evals/workflow.evalset.json"

[tasks."eval:mlflow"]
description = "Run full-conversation MLflow evals + prompt registry (run install:eval first)"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run python evals/mlflow_eval.py"

[tasks."eval:retrieval"]
description = "Compare keyword vs semantic runbook retrieval (install:eval + local Ollama embeddings)"
env = { _.file = { path = "../../.env", redact = true } }
run = "uv run python evals/retrieval_eval.py"

[tasks."eval:cost"]
description = "Check per-case token/model-call usage against cost_baseline.json (run install:eval first)"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run python evals/cost_eval.py"

[tasks."eval:ground"]
description = "Check recognized answer claims against that turn's evidence (run install:eval first)"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run python evals/groundedness_eval.py"

[tasks."eval:ab"]
description = "Compare two pinned prompt versions on the deterministic scorers (run install:eval first)"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run python evals/prompt_ab.py"

[tasks."eval:validate"]
description = "Validate the evalset structure and seed references offline (no model)"
run = "uv run pytest --no-cov tests/test_evalset.py"

[tasks.redteam]
description = "Run deterministic offline adversarial checks (not live model red-teaming)"
run = "uv run pytest --no-cov tests/test_security.py"

[tasks.mcp]
description = "Run the AgentOps Agent MCP server over stdio (Ch. 3.3)"
run = "uv run python -m agent.mcp_server"

[tasks."mcp:http"]
description = "Run the AgentOps Agent MCP server over streamable HTTP on :8000"
env = { MCP_HOST = "127.0.0.1", MCP_PORT = "8000", MCP_TRANSPORT = "streamable-http" }
run = "uv run python -m agent.mcp_server"

[tasks.web]
description = "Run the ADK developer web UI with the configured model on :8002"
# Not ADK's default :8000: the raw MCP server owns that port in the stable network
# contract, so the two would collide whenever Chapter 3.3 is running.
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run adk web src --port 8002"

[tasks.run]
alias = "r"
description = "Run the agent in the terminal with the configured model"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run adk run src/agent"

[tasks.workflow]
description = "Run the bounded read-only planning workflow in the terminal"
env = { AGENT_ENTRYPOINT = "workflow", _.file = { path = "../../.env", redact = true } }
run = "uv run adk run src/agent"

[tasks.coordinator]
description = "Run the least-privilege multi-agent coordinator in the terminal"
env = { AGENT_ENTRYPOINT = "coordinator", _.file = { path = "../../.env", redact = true } }
run = "uv run adk run src/agent"

[tasks.a2a]
description = "Run the persistent A2A server on :8080"
env = { AGENT_ENTRYPOINT = "agent", _.file = { path = "../../.env", redact = true } }
run = "uv run python -m agent.server"

[tasks."data:reset"]
description = "Reset the disposable runtime database from the committed seed"
run = "rm -rf .state"

[tasks.clean]
alias = "n"
description = "Remove caches and build artifacts"
run = "rm -rf .pytest_cache .ruff_cache .ty_cache .coverage htmlcov dist"
