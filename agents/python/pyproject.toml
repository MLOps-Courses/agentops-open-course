# https://docs.astral.sh/uv/reference/settings/
# The AgentOps reference agent — Python track (Google ADK 2.x). MIT licensed.

[project]
name = "agentops-agent"
version = "0.7.0"
description = "The AgentOps Open Course reference agent, built with Google ADK 2.x."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT" # the code license text lives at agents/LICENSE
authors = [{ name = "Médéric HURIER", email = "agentops-open-course@fmind.dev" }]
# --8<-- [start:runtime-dependencies]
dependencies = [
  "aiosqlite>=0.22.1,<0.23", # async SQLite driver for ADK sessions and the A2A task store
  "google-adk[a2a]>=2.6.1", # locked agent runtime + A2A serving; avoid the unused Spanner `db` extra
  "a2a-sdk>=1.1.2", # A2A protocol types + server (Ch. 3.6); 1.x reworked the type surface — kept current with ADK's <2 cap
  # Model Context Protocol server (FastMCP) + client (McpToolset), Ch. 3.3.
  # Capped at <2 because the locked ADK declares `mcp<2`. Lift this bound only with an ADK
  # release that supports MCP 2.x; keeping the direct dependency aligned makes the inherited
  # compatibility constraint explicit.
  "mcp>=2.0.0,<3",
  "openai>=2.51.0", # OSS SDK used by ADK OpenAILlm for direct Ollama or agentgateway
  "opentelemetry-exporter-otlp-proto-http>=1.42.0,<=1.42.1", # match ADK's OTel cap; export to Collector/MLflow
  "pydantic-settings>=2.14.2",
  "presidio-analyzer==2.2.364", # paired release; 2.2.363 caps cryptography below the security floor
  "presidio-anonymizer==2.2.364", # PII redaction paired exactly with the analyzer
  "spacy>=3.8,<3.9", # Presidio's NLP engine; pinned to match the en_core_web_sm model below
  "en-core-web-sm", # small English spaCy model for Presidio (URL-pinned in [tool.uv.sources])
  "tldextract>=5.3.1,<6", # offline email recognition uses its bundled public-suffix snapshot directly
  "cryptography>=50.0.0,<51", # security floor for PYSEC-2026-3552/3553/3554
  "sqlite-vec>=0.1.6",
  "sqlalchemy[asyncio]>=2.0.51,<2.1", # persistent SQLite sessions/tasks without cloud database adapters
]
# --8<-- [end:runtime-dependencies]

[dependency-groups]
# Everything the offline gates need: format, lint, types, and the whole test suite.
# `mise run install` installs this group and nothing else.
dev = [
  # MLflow's SQLAlchemy tracking store imports it to stamp/migrate the schema, and the
  # offline suite registers a prompt against a real local SQLite store. Full `mlflow`
  # would supply it transitively; mlflow-skinny does not.
  "alembic>=1.18.5",
  "anyio>=4.8.0",
  # ADK imports Vertex evaluation types even for the local rubric evaluator.
  # Add only that SDK plus the local scorers instead of ADK's broad `eval` extra,
  # which also pulls the unused LiteLLM-backed evaluator.
  "google-cloud-aiplatform>=1.163.0,<2",
  "hypothesis>=6.164.0",
  "jinja2>=3.1.4,<4", # security floor for spaCy's runtime template dependency
  "lefthook>=2.1.9",
  # mlflow-skinny, not mlflow: the offline suite only imports the tracing, entity,
  # and scorer types. The tracking server, model flavors, and the numeric stack they
  # drag in (pyarrow, scipy, scikit-learn, matplotlib) live in the `eval` group.
  "mlflow-skinny>=3.15,<3.16",
  "pandas>=2.2.3,<3", # `mlflow.genai` imports it eagerly; MLflow 3.15 excludes pandas 3
  "pip-audit>=2.7.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.1",
  "ty>=0.0.65,<0.1", # pre-1.0: pin a compatible range until it stabilizes
  "validate-pyproject>=0.25",
]
# The MLflow/rouge evaluation chain (Ch. 4.4, 7.0), opt-in via `mise run install:eval`.
# Roughly 350 MB of wheels that Chapters 2-3 never touch, on top of the 2.5 GB model
# pull — the difference between a laptop that can start the course and one that cannot.
eval = [
  "mlflow>=3.15,<3.16", # GenAI eval (LLM judges) + prompt registry + tracking server
  "pyarrow>=25.0.0,<26", # current MLflow-compatible line for the evaluation data path
  "rouge-score>=0.1.2",
  "tabulate>=0.9",
]

[tool.uv]
# `uv sync` must not pull the eval chain; `mise run install:eval` adds it explicitly.
default-groups = ["dev"]
override-dependencies = ["cryptography>=50.0.0"]

[[tool.agentops.compatibility-holds]]
package = "mcp"
constraint = "<2"
owner = "google-adk"
owner-constraints = ["mcp<2"]
validation = "MCP/A2A boundary tests"

[[tool.agentops.compatibility-holds]]
package = "opentelemetry-exporter-otlp-proto-http"
constraint = "<=1.42.1"
owner = "google-adk"
owner-constraints = ["opentelemetry-api<=1.42.1", "opentelemetry-sdk<=1.42.1"]
validation = "telemetry unit tests + Platform"

[[tool.agentops.compatibility-holds]]
package = "cryptography"
constraint = "<51"
owner = "presidio-anonymizer"
owner-constraints = ["cryptography<49.0.0"]
validation = "privacy tests + vulnerability audit"

[[tool.agentops.compatibility-holds]]
package = "pandas"
constraint = "<3"
owner = "mlflow"
owner-constraints = ["pandas<3"]
validation = "MLflow evaluation tests"

[tool.uv.sources]
# Pin the small English spaCy model as a reproducible wheel (locked in uv.lock, offline after sync).
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "agent"

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A", # flake8-builtins
  "ARG", # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "E", # pycodestyle errors
  "ERA", # eradicate
  "F", # pyflakes
  "FA", # flake8-future-annotations
  "FURB", # refurb
  "I", # isort
  "ISC", # flake8-implicit-str-concat
  "LOG", # flake8-logging
  "N", # pep8-naming
  "PERF", # Perflint
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PT", # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "Q", # flake8-quotes
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # ruff-specific rules
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "SLF", # flake8-self
  "T10", # flake8-debugger
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"../../scripts/test_*.py" = [
  "S101", # repository unittest fixtures use concise assertions
]
"src/agent/config_check.py" = [
  "T201", # the config:check CLI prints its report to stdout by design
]
"tests/**" = [
  "S101", # assert
  "T201", # print statement allowed in tests
]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = [
  "error",
  'ignore:^BaseAgentConfig is deprecated and will be removed in future versions\. Config is now loaded via reflection so the separate config class is no longer needed\.$:DeprecationWarning',
  'ignore:^\[EXPERIMENTAL\] feature FeatureName\.(JSON_SCHEMA_FOR_FUNC_DECL|PLUGGABLE_AUTH|TOOL_CONFIRMATION) is enabled\.$:UserWarning',
  'ignore:^\[EXPERIMENTAL\] (_?A2a\w+|AgentCardBuilder|AgentRunRequest|convert_\w+|to_a2a):UserWarning',
  'ignore:^Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.$:UserWarning',
  # a2a-sdk 1.x proto validator still reads the deprecated `FieldDescriptor.label`; protobuf 6.x
  # warns, and under `error` this surfaces (via the C HasField call) as a SystemError on message/stream.
  # Harmless at runtime (warnings are not errors there); drop when a2a-sdk moves to `is_repeated()`.
  'ignore:^label\(\) is deprecated\. Use is_required\(\) or is_repeated\(\) instead\.$:DeprecationWarning',
  'ignore:^You should use `Logger` instead\. Deprecated since version 1\.39\.0 and will be removed in a future release\.$:DeprecationWarning',
  'ignore:^You should use `LoggerProvider` instead\. Deprecated since version 1\.39\.0 and will be removed in a future release\.$:DeprecationWarning',
  'ignore:^You should use `ProxyLoggerProvider` instead\. Deprecated since version 1\.39\.0 and will be removed in a future release\.$:DeprecationWarning',
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
