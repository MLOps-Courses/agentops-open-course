<!DOCTYPE html>
<!-- AgentOps Agent web client — a single-file A2A (JSON-RPC over HTTP) browser client.
     Teaching material first: every protocol shape is spelled out in the comments below.
     No build step, framework, or third-party assets; turns use the configured backend. MIT licensed. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentOps Agent — A2A web client</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; }
    .skip-link { position: absolute; left: -10000px; top: auto; }
    .skip-link:focus { left: 1rem; top: 1rem; z-index: 1; background: Canvas; color: CanvasText; padding: .5rem; }
    header h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
    form { display: flex; align-items: end; gap: .5rem; margin: .5rem 0; }
    label { display: grid; gap: .2rem; flex: 1; }
    input[type=url], input[type=text] { flex: 1; padding: .4rem .6rem; }
    button { padding: .4rem .9rem; cursor: pointer; }
    :focus-visible { outline: .2rem solid #005fcc; outline-offset: .15rem; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    #card { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: .5rem; padding: .6rem .8rem; font-size: .85rem; }
    #card ul { margin: .2rem 0 0; padding-left: 1.2rem; }
    #log { display: flex; flex-direction: column; gap: .5rem; margin: 1rem 0; }
    .msg { border-radius: .6rem; padding: .5rem .8rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: color-mix(in srgb, currentColor 12%, transparent); align-self: flex-end; max-width: 85%; }
    .agent { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); align-self: flex-start; max-width: 85%; }
    .system { font-size: .8rem; opacity: .8; align-self: center; }
    .error { color: #b3261e; align-self: center; font-size: .85rem; }
    .tool { font-family: monospace; font-size: .8rem; opacity: .85; align-self: flex-start; }
    /* One visually distinct badge per A2A task state. */
    .state { align-self: center; font-size: .75rem; font-weight: 600; border-radius: 1rem; padding: .1rem .7rem; color: #fff; }
    .state-submitted { background: #5f6368; }
    .state-working { background: #1a73e8; }
    .state-input-required, .state-auth-required { background: #b06000; }
    .state-completed { background: #188038; }
    .state-failed, .state-rejected { background: #b3261e; }
    .state-canceled, .state-unknown { background: #5f6368; }
    .confirm { border: 2px solid #b06000; border-radius: .6rem; padding: .6rem .8rem; align-self: stretch; }
    .confirm pre { font-size: .78rem; overflow-x: auto; margin: .3rem 0; }
    @media (max-width: 32rem) { form { align-items: stretch; flex-direction: column; } }
    @media (forced-colors: active) { .state, .confirm { border: 2px solid ButtonText; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#log">Skip to conversation</a>
  <header>
    <h1>AgentOps Agent — A2A web client</h1>
    <!-- Point at agentgateway :3001 (the governed data plane), never the raw agent :8080. -->
    <form id="connect-form">
      <label for="base-url">A2A base URL
        <input id="base-url" type="url" value="http://localhost:3001" required>
      </label>
      <button type="submit">Connect</button>
    </form>
    <div id="card" aria-live="polite" hidden></div>
  </header>
  <main id="log" tabindex="-1" aria-label="Conversation" aria-live="polite"></main>
  <form id="chat-form">
    <label for="chat-input">Message
      <input id="chat-input" type="text" placeholder="Triage the open incidents." disabled required>
    </label>
    <button id="chat-send" type="submit" disabled>Send</button>
    <button id="task-cancel" type="button" aria-label="Cancel the active task" disabled>Cancel</button>
  </form>

  <script>
    "use strict";
    // ---------------------------------------------------------------------
    // Client state: one A2A "context" is one agent session (the ADK server
    // maps contextId to its session id). taskId resumes an approval pause;
    // activeTaskId remains set for every non-terminal task so it can be canceled.
    // ---------------------------------------------------------------------
    const state = {
      baseUrl: "",
      streaming: false,
      contextId: null,
      taskId: null,
      activeTaskId: null,
      lastAgentText: "",
      lastTaskState: null,
      lastTraceId: null,
      discovering: false,
      sending: false,
      canceling: false,
    };
    const $ = (id) => document.getElementById(id);

    // ------------------------- UI helpers ---------------------------------
    function addBubble(cls, text) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      $("log").append(div);
      div.scrollIntoView({ block: "end" });
      return div;
    }
    function showState(taskState) {
      if (state.lastTaskState === taskState) return;
      state.lastTaskState = taskState;
      addBubble("state state-" + taskState, taskState);
    }
    function requestPending() {
      return state.discovering || state.sending || state.canceling;
    }
    function updateControls() {
      const busy = requestPending();
      $("chat-input").disabled = !state.baseUrl || busy;
      $("chat-send").disabled = !state.baseUrl || busy;
      $("base-url").disabled = busy;
      $("connect-form").querySelector("button").disabled = busy;
      // Cancellation is the one request allowed while a streamed turn is pending.
      $("task-cancel").disabled = !state.activeTaskId || state.discovering || state.canceling;
      for (const form of $("log").querySelectorAll(".confirm form")) {
        const disabled = busy || form.dataset.answered === "true" || form.dataset.taskId !== state.taskId;
        form.querySelectorAll("input,button").forEach((el) => (el.disabled = disabled));
      }
    }
    function rememberTask(taskState, taskId) {
      const terminal = ["completed", "failed", "rejected", "canceled"].includes(taskState);
      state.activeTaskId = terminal ? null : taskId;
      state.taskId = taskState === "input-required" || taskState === "auth-required" ? taskId : null;
      updateControls();
      $("log").querySelector(".confirm input:not(:disabled)")?.focus();
    }

    // --------------------- 1. Agent card discovery ------------------------
    // A2A discovery is a plain GET on a well-known path. The card advertises
    // the protocol version, transports, and capabilities (e.g. streaming).
    $("connect-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (requestPending()) return;
      const baseUrl = $("base-url").value.replace(/\/+$/, "");
      state.discovering = true;
      updateControls();
      try {
        const response = await fetch(baseUrl + "/.well-known/agent-card.json");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const card = await response.json();
        if (!card || typeof card !== "object" ||
            ![card.name, card.version, card.description].every((value) => typeof value === "string") ||
            !Array.isArray(card.skills) || card.skills.some((skill) => !skill ||
              typeof skill.name !== "string" || typeof skill.description !== "string")) {
          throw new Error("Invalid agent card: expected a name, version, description, and skills list.");
        }
        const streaming = card.capabilities?.streaming === true;
        const title = document.createElement("strong");
        title.textContent = `${card.name} v${card.version} — ${card.description}`;
        const skills = document.createElement("ul");
        for (const skill of card.skills) {
          const li = document.createElement("li");
          li.textContent = `${skill.name}: ${skill.description}`;
          skills.append(li);
        }
        // Validate and prepare the card before changing conversation authority.
        // Session and approval identifiers belong only to the discovered endpoint.
        if (baseUrl !== state.baseUrl) {
          state.contextId = null;
          state.taskId = null;
          state.activeTaskId = null;
          state.lastAgentText = "";
          state.lastTaskState = null;
          state.lastTraceId = null;
          $("log").replaceChildren();
        }
        state.baseUrl = baseUrl;
        state.streaming = streaming;
        const el = $("card");
        el.hidden = false;
        el.replaceChildren(title, ` (streaming: ${state.streaming})`, skills);
        addBubble("system", state.contextId ? "Reconnected; the current conversation is preserved." : "Connected.");
      } catch (error) {
        // The most common failure here is CORS: the gateway route must carry
        // a `cors` policy allowing this page's origin (see the README).
        addBubble("error", `Could not fetch the agent card: ${error}. If the URL is reachable with curl, the route is likely missing a CORS policy for this page's origin.`);
      } finally {
        state.discovering = false;
        updateControls();
        if (state.baseUrl) $("base-url").value = state.baseUrl;
      }
    });

    // ----------------------- 2. Sending messages --------------------------
    // Both RPC methods take the same params. Shape of a user text message:
    //   { "jsonrpc": "2.0", "id": "<uuid>", "method": "message/stream",
    //     "params": { "message": { "kind": "message", "messageId": "<uuid>",
    //       "role": "user", "parts": [{ "kind": "text", "text": "..." }],
    //       "contextId": "<session>", "taskId": "<only when resuming>" } } }
    async function sendParts(parts) {
      if (requestPending() || !state.baseUrl) return;
      const message = { kind: "message", messageId: crypto.randomUUID(), role: "user", parts };
      if (state.contextId) message.contextId = state.contextId; // keep one session
      if (state.taskId) message.taskId = state.taskId; // resume the paused task
      state.lastAgentText = ""; // new turn: reset the duplicate-artifact filter
      state.lastTaskState = null;
      state.sending = true;
      updateControls();
      try {
        if (state.streaming) {
          await streamMessage(message); // SSE: incremental task events
        } else {
          await sendMessage(message); // single blocking JSON-RPC response
        }
      } catch (error) {
        addBubble("error", String(error));
      } finally {
        state.sending = false;
        updateControls();
        ($("log").querySelector(".confirm input:not(:disabled)") || $("chat-input")).focus();
      }
    }

    async function postRpc(method, params) {
      return fetch(state.baseUrl + "/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: crypto.randomUUID(), method, params }),
      });
    }

    // message/send: one JSON-RPC response whose result is the finished Task.
    async function sendMessage(message) {
      const response = await postRpc("message/send", { message });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const rpc = await response.json();
      if (rpc.error) throw new Error(`A2A error ${rpc.error.code}: ${rpc.error.message}`);
      handleResult(rpc.result);
    }

    // message/stream: an SSE response; every `data:` line is one JSON-RPC
    // response whose result is a Task, Message, TaskStatusUpdateEvent, or
    // TaskArtifactUpdateEvent. Retry only an explicit unsupported-method response:
    // a JSON result may already have executed the turn, and errors are ambiguous.
    async function streamMessage(message) {
      const response = await postRpc("message/stream", { message });
      const contentType = response.headers.get("content-type") || "";
      if (!response.ok) throw new Error("HTTP " + response.status);
      if (!contentType.includes("text/event-stream")) {
        const rpc = await response.json();
        if (rpc.error && rpc.error.code === -32601) {
          addBubble("system", "Streaming method unavailable, falling back to message/send.");
          return sendMessage(message);
        }
        if (rpc.error) throw new Error(`A2A error ${rpc.error.code}: ${rpc.error.message}`);
        return handleResult(rpc.result);
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        // SSE permits CRLF, LF, or CR record separators. sse-starlette emits
        // CRLF by default, and TextDecoder preserves it in browser strings.
        const frames = buffer.split(/\r\n\r\n|\n\n|\r\r/);
        buffer = frames.pop(); // keep the trailing partial frame
        for (const frame of frames) {
          const data = frame.split(/\r\n|\r|\n/).filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("\n");
          if (!data) continue; // comments/pings such as ": ping"
          const rpc = JSON.parse(data);
          if (rpc.error) throw new Error(`A2A error ${rpc.error.code}: ${rpc.error.message}`);
          handleResult(rpc.result);
        }
      }
    }

    // ----------------------- 3. Rendering results -------------------------
    function handleResult(result) {
      if (!result) return;
      const traceId = result.metadata && result.metadata.mlflow_trace_id;
      if (typeof traceId === "string" && /^tr-[0-9a-f]{32}$/.test(traceId) && traceId !== state.lastTraceId) {
        state.lastTraceId = traceId;
        addBubble("system", `Trace for this response: ${traceId}`);
      }
      if (result.kind === "task") {
        // Initial Task snapshot: remember ids, then render its current state.
        state.contextId = result.contextId;
        showState(result.status.state);
        for (const artifact of result.artifacts || []) renderParts(artifact.parts);
        if (result.status.message) renderParts(result.status.message.parts, result.status.state, result.id);
        rememberTask(result.status.state, result.id);
      } else if (result.kind === "status-update") {
        state.contextId = result.contextId;
        showState(result.status.state);
        if (result.status.message) renderParts(result.status.message.parts, result.status.state, result.taskId);
        rememberTask(result.status.state, result.taskId);
      } else if (result.kind === "artifact-update") {
        renderParts(result.artifact.parts);
      } else if (result.kind === "message") {
        renderParts(result.parts);
      }
    }

    function renderParts(parts, taskState, taskId) {
      for (const part of parts || []) {
        if (part.kind === "text") {
          if (part.text === state.lastAgentText) continue; // final artifact repeats the last update
          state.lastAgentText = part.text;
          addBubble("agent", part.text);
        } else if (part.kind === "data") {
          renderDataPart(part, taskState, taskId);
        }
      }
    }

    // ADK transports tool traffic as DataParts tagged with adk_* metadata:
    //   metadata: { "adk_type": "function_call" | "function_response", "adk_is_long_running": true? }
    // A guarded action surfaces as a *long-running* function call named
    // "adk_request_confirmation" on a task paused in `input-required`.
    function renderDataPart(part, taskState, taskId) {
      const meta = part.metadata || {};
      if (meta.adk_type === "function_call" && part.data.name === "adk_request_confirmation") {
        renderConfirmation(part.data, taskId);
      } else if (meta.adk_type === "function_call") {
        addBubble("tool", `tool call: ${part.data.name}(${JSON.stringify(part.data.args)})`);
      } else if (meta.adk_type === "function_response") {
        addBubble("tool", `tool result: ${JSON.stringify(part.data.response)}`);
      } else {
        addBubble("tool", JSON.stringify(part.data));
      }
    }

    // -------------------- 4. Human approval round-trip --------------------
    // The pause carries the original call and a ToolConfirmation:
    //   data: { "id": "<call-id>", "name": "adk_request_confirmation",
    //           "args": { "originalFunctionCall": {...}, "toolConfirmation": { "hint": "...", "confirmed": false } } }
    // The human answers by sending a FunctionResponse DataPart on the SAME
    // task. The AgentOps Agent refuses approvals without a rationale — that is
    // the audit contract, so the form requires one.
    function renderConfirmation(call, taskId) {
      const original = call.args.originalFunctionCall || {};
      const hint = (call.args.toolConfirmation || {}).hint || "The agent requests approval for a guarded action.";
      const box = document.createElement("div");
      box.className = "msg confirm";
      const title = document.createElement("strong");
      title.textContent = "Approval required: " + (original.name || "guarded action");
      const details = document.createElement("pre");
      details.textContent = JSON.stringify(original.args || {}, null, 2);
      const hintP = document.createElement("p");
      hintP.textContent = hint;
      const reviewP = document.createElement("p");
      reviewP.textContent =
        "Review the evidence and tool results above before deciding. When execution resumes, the action re-reads current state and the write transaction validates the target; approval applies to these arguments, not to a frozen snapshot.";
      const form = document.createElement("form");
      form.dataset.taskId = taskId || "";
      const rationaleLabel = document.createElement("label");
      rationaleLabel.textContent = "Approval rationale";
      const rationale = document.createElement("input");
      rationale.type = "text";
      rationale.placeholder = "Rationale (required to approve)";
      rationale.required = true;
      rationaleLabel.append(rationale);
      const approve = document.createElement("button");
      approve.textContent = "Approve";
      const deny = document.createElement("button");
      deny.type = "button";
      deny.textContent = "Deny";
      form.append(rationaleLabel, approve, deny);
      box.append(title, hintP, details, reviewP, form);
      $("log").append(box);
      box.scrollIntoView({ block: "end" });

      const answer = (confirmed) => {
        if (requestPending() || form.dataset.answered === "true" || state.taskId !== taskId) return;
        form.dataset.answered = "true";
        addBubble("user", (confirmed ? "Approved: " : "Denied. ") + rationale.value);
        // Reply shape consumed by ADK's confirmation processor:
        //   data: { "id": "<same call-id>", "name": "adk_request_confirmation",
        //           "response": { "confirmed": true, "payload": { "rationale": "..." } } }
        sendParts([{
          kind: "data",
          data: { id: call.id, name: call.name, response: { confirmed, payload: { rationale: rationale.value } } },
          metadata: { adk_type: "function_response" },
        }]);
      };
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (rationale.value.trim()) answer(true);
      });
      deny.addEventListener("click", () => answer(false));
      updateControls();
    }

    // --------------------------- Composer ----------------------------------
    $("chat-form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (requestPending() || !state.baseUrl) return;
      const text = $("chat-input").value.trim();
      if (!text) return;
      addBubble("user", text);
      $("chat-input").value = "";
      sendParts([{ kind: "text", text }]);
    });

    $("task-cancel").addEventListener("click", async () => {
      const taskId = state.activeTaskId;
      if (!taskId || state.discovering || state.canceling) return;
      state.canceling = true;
      updateControls();
      try {
        const response = await postRpc("tasks/cancel", { id: taskId });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const rpc = await response.json();
        if (rpc.error) throw new Error(`A2A error ${rpc.error.code}: ${rpc.error.message}`);
        rememberTask(rpc.result.status.state, rpc.result.id);
        showState(rpc.result.status.state);
      } catch (error) {
        addBubble("error", `Could not cancel the active task: ${error}`);
      } finally {
        state.canceling = false;
        updateControls();
      }
    });
  </script>
</body>
</html>
