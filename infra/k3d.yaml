apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: local
servers: 1
# No agent node, on purpose. The kagent Agent, the MCP Deployment, and the
# state-backup Job all mount the same ReadWriteOnce `agentops-agent-state` claim
# with no affinity, and k3s `local-path` pins the PersistentVolume to whichever
# node provisioned it — so a second schedulable node makes Chapter 6.3 a coin flip
# between "runs" and "volume node affinity conflict". One node also frees 300-400 MiB.
agents: 0
# Pin the multi-platform manifest as well as the reviewed tag so upstream cannot
# change the node bytes without a source review and Platform rerun.
image: docker.io/rancher/k3s:v1.36.2-k3s1@sha256:6a47cea22c4b834d4ba72c89d291696b79ebe406251f90b446e4dff03513dd87
kubeAPI:
  hostIP: 127.0.0.1
registries:
  create:
    name: registry.localhost
    host: 127.0.0.1
    hostPort: "5050"
options:
  k3d:
    wait: true
    timeout: 120s
    disableLoadbalancer: true
  k3s:
    extraArgs:
      - arg: --disable=traefik,servicelb
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
