# One vendor-neutral OTLP entry point. Tempo stores traces, Loki stores logs,
# and Prometheus scrapes both native metrics and RED metrics derived by
# spanmetrics. Grafana reads all three, so no signal needs its own UI.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch: {}

connectors:
  span_metrics:
    namespace: agentops
    metrics_flush_interval: 5s
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.request.model

exporters:
  # `otlp_http` is the collector's OTLP-over-HTTP exporter (`otlphttp` is the
  # same component under its other registered id). It must stay HTTP: Tempo's
  # receiver below listens for OTLP/HTTP on :4318, and the plain `otlp`
  # exporter would speak gRPC at it and silently fail every export.
  otlp_http/tempo:
    endpoint: http://tempo:4318
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo, span_metrics]
    metrics:
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
