apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Logs -> traces. Loki's OTLP endpoint promotes an OTLP log record's
      # trace id to the `trace_id` structured-metadata field, so match on the
      # field name rather than on a line pattern: the link then survives any
      # change to the agent's log formatting.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          # `$$` escapes Grafana's provisioning interpolation. Written as a
          # single `$`, Grafana expands `${__value.raw}` as an environment
          # variable at load time and provisions an empty, silently dead link.
          url: "$${__value.raw}"
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Traces -> logs. The window is widened either side of the span because a
      # log record is written before the span it belongs to is exported.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
        # Both sides carry OTLP resource attributes, but Loki normalizes dots to
        # underscores when it promotes them to labels.
        tags:
          - key: service.name
            value: service_name
