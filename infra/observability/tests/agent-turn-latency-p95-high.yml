# Deterministic proof for AgentTurnLatencyP95High. Two things about this rule
# are easy to get wrong and impossible to see by reading it: the quantile is
# interpolated inside whichever bucket the 95th observation lands in, so the
# alert's real threshold depends on the collector's explicit bucket list
# ([100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s] in otel-collector.yaml), and
# `sum by (le)` folds every span name into one histogram, so a slow model turn
# is diluted by whatever fast tool spans are running beside it. Both are
# exercised below with two span names at different latencies.
#
# The `for: 5m` and the `[10m]` rate window are also different clocks, which is
# why the alert lags the degradation by more than its `for:` alone suggests.
rule_files:
  - ../prometheus-rules.yml

evaluation_interval: 1m

tests:
  # A model that gets slow and then recovers, with steady tool traffic beside
  # it. Minutes 0-60: 4 model turns/min in the (1s, 2s] bucket, 6 tool reads/min
  # in (100ms, 250ms] — p95 is 1.875s. Minutes 61-120: the model turns move to
  # 3/min in (5s, 10s] and 1/min in (10s, 30s], which puts p95 at exactly 20s.
  # Minutes 121-180: the model recovers.
  - interval: 1m
    input_series:
      # Tool reads: fast and unchanging, so they only ever pull the merged
      # quantile down. Their cumulative buckets from le="0.25" upward carry the
      # same count, which is what a bucketed histogram looks like when every
      # observation lands in one bucket.
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="0.1"}'
        values: "0x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="0.25"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="0.5"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="1"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="2"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="5"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="10"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="30"}'
        values: "0+6x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="get_incident",le="+Inf"}'
        values: "0+6x180"
      # Model turns: 4/min throughout. Only the bucket they land in changes, so
      # the alert is driven by latency alone and not by a traffic swing.
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="0.1"}'
        values: "0x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="0.25"}'
        values: "0x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="0.5"}'
        values: "0x180"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="1"}'
        values: "0x180"
      # le="2" and le="5" stop climbing during the slow hour: nothing lands
      # under 5s any more.
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="2"}'
        values: "0+4x60 240x59 244+4x59"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="5"}'
        values: "0+4x60 240x59 244+4x59"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="10"}'
        values: "0+4x60 243+3x59 424+4x59"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="30"}'
        values: "0+4x60 244+4x59 484+4x59"
      - series: 'agentops_duration_seconds_bucket{service_name="agentops-agent",span_name="call_llm",gen_ai_operation_name="chat",gen_ai_request_model="qwen3:4b-instruct",le="+Inf"}'
        values: "0+4x60 244+4x59 484+4x59"
    # The interpolated value, not just the verdict: 90 observations per merged
    # 10m window, 81 of them at or under 10s, so the 85.5th sits halfway across
    # the (10s, 30s] bucket. Assert 20 and the bucket arithmetic is pinned; the
    # threshold could be moved to 18 and this test would still notice.
    promql_expr_test:
      - expr: histogram_quantile(0.95, sum by (le) (rate(agentops_duration_seconds_bucket[10m])))
        eval_time: 75m
        exp_samples:
          - labels: "{}"
            value: 20
      - expr: histogram_quantile(0.95, sum by (le) (rate(agentops_duration_seconds_bucket[10m])))
        eval_time: 30m
        exp_samples:
          - labels: "{}"
            value: 1.875
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentTurnLatencyP95High
        exp_alerts: []
      # Minute 68 is inside the `for: 5m` window: the [10m] rate only fills with
      # slow turns gradually, so p95 first crosses 15s at minute 67 rather than
      # at minute 61 when the model actually slowed down.
      - eval_time: 68m
        alertname: AgentTurnLatencyP95High
        exp_alerts: []
      - eval_time: 75m
        alertname: AgentTurnLatencyP95High
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: Agent span p95 latency exceeds 15s
              description: The 95th percentile span duration stayed above 15s for 5 minutes. Check for model reloads, CPU contention, or oversized contexts.
              runbook: https://github.com/MLOps-Courses/agentops-open-course/blob/main/content/7.%20Observability/7.2b.%20Alerting.md#the-four-responses-worth-memorising
      # A full [10m] window after recovery, so the slow turns have aged out.
      - eval_time: 145m
        alertname: AgentTurnLatencyP95High
        exp_alerts: []
