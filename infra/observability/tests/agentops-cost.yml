# Deterministic proof for the three cost alerts. None of them can be driven on
# the shipped local path — the model catalog prices self-hosted Qwen at exactly
# zero, so spend is always 0, and a catalog miss cannot happen while the backend
# pins the one model the catalog knows. Synthetic series are therefore the only
# honest evidence that these rules fire when they should and stay quiet when
# they should not.
rule_files:
  - ../prometheus-rules.yml

evaluation_interval: 1m

tests:
  # Spend burn: flat for 90 minutes, then 0.01 dollars per minute (0.60 per
  # hour), which is roughly nine times the even burn of the stated budget.
  - interval: 1m
    input_series:
      - series: 'agentgateway_gen_ai_client_cost_usd_total{gen_ai_request_model="gemini-3.5-flash",listener="llm"}'
        values: "0x90 0+0.01x90"
    alert_rule_test:
      - eval_time: 60m
        alertname: AgentModelSpendBudgetBurn
        exp_alerts: []
      - eval_time: 150m
        alertname: AgentModelSpendBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              category: cost
            exp_annotations:
              summary: Model spend is burning the monthly budget about four times too fast
              description: Model calls through the gateway have cost more than four times the even burn of the stated USD 50 monthly budget for 15 minutes. At this rate the month is spent in about a week. Look for a caller whose context is growing, a retry storm, or a model swap.
              runbook: https://github.com/MLOps-Courses/agentops-open-course/blob/main/content/7.%20Observability/7.3b.%20Cost%20Governance.md

  # Unpriced model: priced traffic alone is silent, so a busy lab does not page
  # itself; only a catalog miss fires.
  - interval: 1m
    input_series:
      - series: 'agentgateway_cost_catalog_lookups_total{status="Exact",listener="llm"}'
        values: "0+2x80"
      - series: 'agentgateway_cost_catalog_lookups_total{status="Missing",listener="llm"}'
        values: "0x40 1+1x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentModelUnpriced
        exp_alerts: []
      - eval_time: 50m
        alertname: AgentModelUnpriced
        exp_alerts:
          - exp_labels:
              severity: ticket
              category: cost
            exp_annotations:
              summary: Model calls are being served at a price the catalog does not know
              description: The gateway served calls for a model with no entry in config.modelCatalog in the last 15 minutes. Their tokens are counted and their cost is reported as zero, so every dollar figure downstream is an undercount until the catalog gains that model.
              runbook: https://github.com/MLOps-Courses/agentops-open-course/blob/main/content/7.%20Observability/7.3b.%20Cost%20Governance.md

  # Route budget refusals: MCP refusals belong to another owner, model route
  # refusals belong to this alert. The MCP series runs hot throughout so the
  # listener selector is actually exercised rather than assumed.
  - interval: 1m
    input_series:
      - series: 'agentgateway_requests_total{listener="mcp",reason="RateLimit",status="429"}'
        values: "0+3x60"
      - series: 'agentgateway_requests_total{listener="llm",reason="RateLimit",status="429"}'
        values: "0x30 1+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: AgentModelBudgetRefusals
        exp_alerts: []
      - eval_time: 40m
        alertname: AgentModelBudgetRefusals
        exp_alerts:
          - exp_labels:
              severity: ticket
              category: cost
            exp_annotations:
              summary: The gateway is refusing model calls against its route budget
              description: "The model route returned HTTP 429 from its request or token bucket in the last 10 minutes. Compare the refusal count with the token burn: a spending caller means the cap worked, a low burn means the cap is smaller than one honest turn."
              runbook: https://github.com/MLOps-Courses/agentops-open-course/blob/main/content/7.%20Observability/7.3b.%20Cost%20Governance.md
