# Deterministic proof for AgentErrorBudgetBurn, one of the two rules that page.
# It is a conjunction of three independent vetoes — a fast window, a slow
# window, and an absolute failure floor — so a test that only shows it firing
# proves the least interesting third of it. Each case below holds two conjuncts
# true and drives the third across its threshold, which is the only way to show
# that each one really can keep a phone quiet. Driving this against the live
# stack would mean breaking the model provider for over an hour, so the
# synthetic replay is the honest evidence rather than the convenient one.
rule_files:
  - ../prometheus-rules.yml

evaluation_interval: 1m

tests:
  # A stopped model provider: an hour of healthy traffic at 5 spans/min, then
  # every turn fails at 8/min for an hour, then recovery. The 5m window sees
  # 100% failure within minutes; the 1h window still remembers the healthy hour
  # and takes until minute 66 to cross 14.4%. That gap is the whole point of a
  # multiwindow burn, and minute 63 below is where it is visible.
  - interval: 1m
    input_series:
      - series: 'agentops_calls_total{service_name="agentops-agent",span_name="invocation",span_kind="SPAN_KIND_INTERNAL",status_code="STATUS_CODE_OK"}'
        values: "0+5x60 300x59 305+5x59"
      - series: 'agentops_calls_total{service_name="agentops-agent",span_name="invocation",span_kind="SPAN_KIND_INTERNAL",status_code="STATUS_CODE_ERROR"}'
        values: "0x60 8+8x59 480x59"
    # The recording rules the alert reads, compared with `> bool` so the assert
    # is the rule's own threshold rather than a float that Prometheus'
    # rate extrapolation could legitimately shift by a hair.
    promql_expr_test:
      - expr: agentops:calls:error_ratio_rate5m > bool (14.4 * 0.010)
        eval_time: 63m
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: agentops:calls:error_ratio_rate1h > bool (14.4 * 0.010)
        eval_time: 63m
        exp_samples:
          - labels: "{}"
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentErrorBudgetBurn
        exp_alerts: []
      # Three minutes into a total outage. The fast window reads 79.3% — five
      # times the threshold, and short of 100% only because minutes 59 and 60
      # are still inside it; it saturates at minute 64. The floor is long since
      # cleared, and only the slow window still disagrees.
      - eval_time: 63m
        alertname: AgentErrorBudgetBurn
        exp_alerts: []
      - eval_time: 80m
        alertname: AgentErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Agent spans are burning the 99% success error budget
              description: At least three agent spans failed in 5m, and more than 14.4% failed over both the last 5m and 1h. The usual causes are a stopped model provider (Ollama), a misconfigured gateway route, or a failing tool backend.
              runbook: https://github.com/MLOps-Courses/agentops-open-course/blob/main/content/7.%20Observability/7.2b.%20Alerting.md#the-four-responses-worth-memorising
      # The provider is back. The 5m window clears first and resolves the page
      # on its own, while the 1h ratio is still decaying — a page that needs an
      # hour to clear after the fix is a page nobody trusts.
      - eval_time: 150m
        alertname: AgentErrorBudgetBurn
        exp_alerts: []

  # Sparse lab traffic: one turn a minute, half of them failing, for forty
  # minutes. Both burn windows sit at 50% — three and a half times the paging
  # threshold — and the rule stays silent purely because fewer than three spans
  # failed in any 5m window. This is the case the floor exists for: without it,
  # one bad request out of two would page at 02:00 on a laptop.
  - interval: 1m
    input_series:
      - series: 'agentops_calls_total{service_name="agentops-agent",span_name="invocation",span_kind="SPAN_KIND_INTERNAL",status_code="STATUS_CODE_OK"}'
        values: "0x1 1x1 2x1 3x1 4x1 5x1 6x1 7x1 8x1 9x1 10x1 11x1 12x1 13x1 14x1 15x1 16x1 17x1 18x1 19x1 20x1 20x19"
      - series: 'agentops_calls_total{service_name="agentops-agent",span_name="invocation",span_kind="SPAN_KIND_INTERNAL",status_code="STATUS_CODE_ERROR"}'
        values: "0x1 1x1 2x1 3x1 4x1 5x1 6x1 7x1 8x1 9x1 10x1 11x1 12x1 13x1 14x1 15x1 16x1 17x1 18x1 19x1 20x1 24+4x19"
    # Both ratios burn, the floor does not clear: 1, 1, 0. Change any one of
    # those three numbers and the alert's behaviour at minute 35 changes.
    promql_expr_test:
      - expr: agentops:calls:error_ratio_rate5m > bool (14.4 * 0.010)
        eval_time: 35m
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: agentops:calls:error_ratio_rate1h > bool (14.4 * 0.010)
        eval_time: 35m
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: sum(increase(agentops_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) >= bool 3
        eval_time: 35m
        exp_samples:
          - labels: "{}"
            value: 0
    alert_rule_test:
      - eval_time: 35m
        alertname: AgentErrorBudgetBurn
        exp_alerts: []
      # Minute 42 is the first evaluation where the floor clears (four failures
      # arrive in one minute), so minute 43 is inside the 2m `for:` window and
      # the alert is pending rather than firing.
      - eval_time: 43m
        alertname: AgentErrorBudgetBurn
        exp_alerts: []
      - eval_time: 46m
        alertname: AgentErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: Agent spans are burning the 99% success error budget
              description: At least three agent spans failed in 5m, and more than 14.4% failed over both the last 5m and 1h. The usual causes are a stopped model provider (Ollama), a misconfigured gateway route, or a failing tool backend.
              runbook: https://github.com/MLOps-Courses/agentops-open-course/blob/main/content/7.%20Observability/7.2b.%20Alerting.md#the-four-responses-worth-memorising
