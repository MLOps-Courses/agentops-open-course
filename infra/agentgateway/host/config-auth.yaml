# yaml-language-server: $schema=https://raw.githubusercontent.com/agentgateway/agentgateway/v1.4.1/schema/config.json
# Secured host data plane (opt-in, Chapter 5.5): same upstreams as config.yaml
# plus caller authentication and TLS on every exposed listener.
#
# Generate the demo-only material first (both outputs are gitignored), then
# start the hardened gateway container from the repository root:
#
#   infra/scripts/gateway-tls.sh
#   infra/scripts/gateway-jwt.sh
#   AGENTOPS_GATEWAY_CONFIG=config-auth.yaml infra/scripts/gateway-host.sh run
#
# Honest scope: the certificate is self-signed lab trust (clients must pass it
# with --cacert), the JWT issuer is a local script instead of an IdP, and the
# model API key is the same non-secret marker the chapter already exports as
# OPENAI_API_KEY — public in this repository, so demo-only by construction.
config:
  # This catalog measures provider token charges only. Self-hosted Qwen has no
  # per-token provider fee, so the exact rate is zero rather than an invented
  # estimate of electricity, hardware, labor, or a bill.
  modelCatalog:
    - inline:
        providers:
          openai:
            models:
              qwen3:4b-instruct:
                rates:
                  input: "0"
                  output: "0"
  logging:
    format: json

gateways:
  mcp:
    port: 3000
    protocol: HTTPS
    tls:
      cert: infra/agentgateway/host/auth/tls-cert.pem
      key: infra/agentgateway/host/auth/tls-key.pem
  a2a:
    port: 3001
    protocol: HTTPS
    tls:
      cert: infra/agentgateway/host/auth/tls-cert.pem
      key: infra/agentgateway/host/auth/tls-key.pem
  llm:
    port: 4000
    protocol: HTTPS
    tls:
      cert: infra/agentgateway/host/auth/tls-cert.pem
      key: infra/agentgateway/host/auth/tls-key.pem

routes:
  - name: mcp
    gateways: [mcp]
    policies:
      # Identity first: a missing or invalid token is rejected with 401 before
      # any MCP protocol handling or authorization rule runs.
      jwtAuth:
        mode: strict
        issuer: agentops-course
        audiences: [agentops-gateway]
        jwks:
          file: infra/agentgateway/host/auth/jwks.json
      retry:
        attempts: 2
        backoff: 100ms
        codes: [502, 503, 504]
      timeout:
        requestTimeout: 5s
        backendRequestTimeout: 2s
      localRateLimit:
        - maxTokens: 120
          tokensPerFill: 120
          fillInterval: 60s
      # The verified identity feeds tool authorization: ops-admin keeps the
      # six read tools, ops-viewer only the two incident reads.
      mcpAuthorization:
        rules:
          - 'jwt.sub == "ops-admin" && mcp.tool.name == "list_incidents"'
          - 'jwt.sub == "ops-admin" && mcp.tool.name == "get_incident"'
          - 'jwt.sub == "ops-admin" && mcp.tool.name == "get_service_status"'
          - 'jwt.sub == "ops-admin" && mcp.tool.name == "search_service_logs"'
          - 'jwt.sub == "ops-admin" && mcp.tool.name == "get_runbook"'
          - 'jwt.sub == "ops-admin" && mcp.tool.name == "search_runbooks"'
          - 'jwt.sub == "ops-viewer" && mcp.tool.name == "list_incidents"'
          - 'jwt.sub == "ops-viewer" && mcp.tool.name == "get_incident"'
    backends:
      - mcp:
          failureMode: failClosed
          targets:
            - name: agentops-agent
              mcp:
                host: http://localhost:8000/mcp

  - name: a2a
    gateways: [a2a]
    policies:
      a2a: {}
      jwtAuth:
        mode: strict
        issuer: agentops-course
        audiences: [agentops-gateway]
        jwks:
          file: infra/agentgateway/host/auth/jwks.json
      localRateLimit:
        - maxTokens: 60
          tokensPerFill: 60
          fillInterval: 60s
      # Carry the JWT-verified subject to the app as a trusted header,
      # replacing any client-supplied copy (`set` overwrites), so a guarded
      # write's audit row names the real operator (Chapters 5.5 / 7.6). The
      # app honors it only when AGENT_TRUSTED_IDENTITY_HEADER is set.
      transformations:
        request:
          set:
            x-verified-subject: jwt.sub
    backends:
      - host: localhost:8080

  - name: llm
    gateways: [llm]
    policies:
      # The OpenAI SDK already sends OPENAI_API_KEY as a Bearer header, so
      # enforcing the chapter's marker value needs no agent change.
      apiKey:
        mode: strict
        keys:
          - key: agentgateway
            metadata:
              client: course-learner
      # Same two buckets as the plain host profile: requests bound how often a
      # caller may ask, tokens bound how much it may spend. Authentication
      # names the caller; neither bucket is per-caller (see 7.3b).
      localRateLimit:
        - maxTokens: 30
          tokensPerFill: 30
          fillInterval: 60s
        - maxTokens: 100000
          tokensPerFill: 100000
          fillInterval: 60s
          type: tokens
      ai:
        # The client route type is what agentgateway parses the body with, and the
        # default assumption is chat-completions. Without the first entry a Responses
        # request is rejected as "missing field `messages`" and the response guard
        # below would inspect a shape that never arrives; the agent speaks only
        # /v1/responses (ADK Go's openaimodel has no chat-completions code path).
        # The second entry admits the *other* OpenAI shape on the same governed route,
        # because the evaluation judge (evals/judge.go) speaks chat-completions and
        # `.env.example` tells the reader to point it at :4000. One route, so the judge
        # passes through the same buckets, prompt guard, and response guard as the
        # agent rather than being a second unpoliced door to the same model.
        routes:
          /v1/responses: responses
          /v1/chat/completions: completions
        promptGuard:
          request:
            # Reserved smoke canary preserves the 400/502 rejection evidence;
            # ordinary email continues to the central mask rule below.
            - regex:
                action: reject
                rules:
                  - pattern: "(?i)reject-probe@example\\.invalid"
              rejection:
                status: 400
                body: Request rejected by the course prompt guard.
            - regex:
                action: reject
                rules:
                  - pattern: "(?i)(ignore|override).{0,40}(instructions|system prompt)"
              rejection:
                status: 400
                body: Request rejected by the course prompt guard.
            - regex:
                action: mask
                rules:
                  - builtin: ssn
                  - builtin: creditCard
                  - builtin: phoneNumber
                  - builtin: email
                  - builtin: caSin
            - webhook:
                target:
                  host: localhost:8080
                failureMode: failClosed
          response:
            - regex:
                action: reject
                rules:
                  - pattern: "(?i)reject-probe@example\\.invalid"
              rejection:
                status: 502
                body: Model response rejected by the course data-loss guard.
            - regex:
                action: mask
                rules:
                  - builtin: ssn
                  - builtin: creditCard
                  - builtin: phoneNumber
                  - builtin: email
                  - builtin: caSin
            - webhook:
                target:
                  host: localhost:8080
                failureMode: failClosed
    backends:
      - ai:
          name: ollama
          # No pathOverride: agentgateway derives the upstream path from the route
          # type resolved above (/v1/responses or /v1/chat/completions), so both
          # client shapes reach the endpoint Ollama actually serves. Pinning one
          # path here forced every chat-completions call onto /v1/responses, which
          # returned an empty Responses body the judge read as "no verdict content".
          # An unmapped path is still refused at the parse stage, never proxied.
          hostOverride: localhost:11434
          provider:
            openAI:
              model: qwen3:4b-instruct
