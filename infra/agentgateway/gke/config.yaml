# yaml-language-server: $schema=https://raw.githubusercontent.com/agentgateway/agentgateway/v1.4.1/schema/config.json
# GKE data plane. Vertex authentication comes from ambient GKE Workload Identity.
config:
  # Vertex stays unpriced until an owner supplies a dated, region-specific
  # provider catalog. Absence is more honest than a copied or invented rate.
  logging:
    format: json
  # Pod-local readiness endpoint (/healthz/ready) on :15021, the same address
  # the host wrapper injects. A data port answers TCP before backends, policies,
  # and JWKS are usable, so the kubelet probes this instead. It needs no Service
  # port: the kubelet dials the pod IP directly.
  readinessAddr: 0.0.0.0:15021
  tracing:
    otlpEndpoint: http://otel-collector.agentops.svc.cluster.local:4317
    randomSampling: true

gateways:
  mcp:
    port: 3000
  a2a:
    port: 3001
  llm:
    port: 4000

routes:
  - name: mcp
    gateways: [mcp]
    policies:
      retry:
        attempts: 2
        backoff: 100ms
        codes: [502, 503, 504]
      timeout:
        requestTimeout: 5s
        backendRequestTimeout: 2s
      localRateLimit:
        - maxTokens: 120
          tokensPerFill: 120
          fillInterval: 60s
      mcpAuthorization:
        rules:
          - 'mcp.tool.name == "list_incidents"'
          - 'mcp.tool.name == "get_incident"'
          - 'mcp.tool.name == "get_service_status"'
          - 'mcp.tool.name == "search_service_logs"'
          - 'mcp.tool.name == "get_runbook"'
          - 'mcp.tool.name == "search_runbooks"'
    backends:
      - mcp:
          failureMode: failClosed
          targets:
            - name: agentops-agent
              mcp:
                host: http://agentops-mcp.agentops.svc.cluster.local:8000/mcp

  - name: a2a
    gateways: [a2a]
    policies:
      a2a: {}
      cors:
        allowOrigins:
          - "http://localhost:8001"
        allowMethods:
          - GET
          - POST
          - OPTIONS
        allowHeaders:
          - content-type
      localRateLimit:
        - maxTokens: 60
          tokensPerFill: 60
          fillInterval: 60s
    backends:
      - host: agentops-agent.agentops.svc.cluster.local:8080

  - name: llm
    gateways: [llm]
    policies:
      # Caller authentication: enforce the marker that the in-cluster agent and
      # kagent send as OPENAI_API_KEY from the agentgateway-client secret. The
      # public course value is a demo credential; rotate both uses in reality.
      # Vertex access still comes from ambient Workload Identity (backendAuth),
      # never from this caller-side key.
      apiKey:
        mode: strict
        keys:
          - key: agentgateway
            metadata:
              client: agentops-course
      # The only profile where tokens are billed by someone else. The request
      # bucket cannot see a caller that grows its context, so the token bucket
      # carries the spend ceiling. Vertex has no catalog rates here, so the
      # gateway counts these tokens without pricing them — the cap is real,
      # the dollar figure is not (7.3b).
      localRateLimit:
        - maxTokens: 30
          tokensPerFill: 30
          fillInterval: 60s
        - maxTokens: 100000
          tokensPerFill: 100000
          fillInterval: 60s
          type: tokens
      ai:
        # Same override, and for the same reason, as the host profile: the client
        # route type is what agentgateway parses the body with, and without it the
        # listener assumes chat-completions and answers every agent request with
        # 503 "missing field `messages`". ADK Go's openaimodel has no
        # chat-completions code path, so the agent speaks only /v1/responses. The
        # guards below depend on this too — they would otherwise inspect a shape
        # that never arrives.
        routes:
          /v1/responses: responses
        # Reject-only, unlike host and k3d — and the reason is worth stating rather
        # than looking like an omission.
        #
        # The other two profiles reject, then mask five builtin entity classes, then
        # ask a private Go webhook for the person, location, and organization spans a
        # regex cannot see. Both of those extra stages need a model beside the
        # gateway: masking is cheap only because Ollama is already on the same host,
        # and the webhook asks that same Ollama for its answer. On GKE there is no
        # co-hosted model to ask; the backend is Vertex, and a per-request round trip
        # to a hosted model just to decide whether to rewrite a prompt would double
        # the cost and the latency of every call to buy a weaker guard.
        #
        # So fail-closed means something different here. Where host and k3d rewrite a
        # request and let it through, this profile refuses it. That is the stricter
        # behavior, not the looser one, and it is why `scripts/check-infra.sh`
        # compares this guard by shape (two reject stages, no webhook) instead of
        # demanding it equal the other two.
        promptGuard:
          request:
            - regex:
                action: reject
                rules:
                  - builtin: email
                  - pattern: "(?i)(ignore|override).{0,40}(instructions|system prompt)"
              rejection:
                status: 400
                body: Request rejected by the course prompt guard.
          response:
            - regex:
                action: reject
                rules:
                  - builtin: email
              rejection:
                status: 502
                body: Model response rejected by the course data-loss guard.
    backends:
      - ai:
          name: vertex
          provider:
            vertex:
              model: google/gemini-3.5-flash
              projectId: __GCP_PROJECT_ID__
              region: global
          policies:
            backendAuth:
              gcp: {}
