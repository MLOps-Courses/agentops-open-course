apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: agentops
build:
  tagPolicy:
    # A dirty development tree must never receive a HEAD-looking image tag.
    envTemplate:
      template: "{{.AGENT_IMAGE_TAG}}"
  local:
    push: true
    useBuildkit: true
  artifacts:
    - image: agentops-agent
      context: ../agents
      docker:
        dockerfile: go/Dockerfile
        buildArgs:
          AGENT_BUILD_MODE: "{{.AGENT_BUILD_MODE}}"
          AGENT_SOURCE_COMMIT: "{{.AGENT_SOURCE_COMMIT}}"
          AGENT_SOURCE_REVISION: "{{.AGENT_SOURCE_REVISION}}"
          AGENT_SOURCE_TREE_DIGEST: "{{.AGENT_SOURCE_TREE_DIGEST}}"
          AGENT_SOURCE_DIRTY: "{{.AGENT_SOURCE_DIRTY}}"
          OCI_CREATED: "{{.OCI_CREATED}}"
          OCI_VERSION: "{{.OCI_VERSION}}"
manifests:
  kustomize:
    paths:
      - k8s/overlays/local
deploy:
  kubectl: {}
# Teach Skaffold where kagent stores the BYO workload image in its custom resource.
resourceSelector:
  allow:
    - groupKind: Agent.kagent.dev
      image: [.spec.byo.deployment.image]
      labels: [.metadata.labels]
profiles:
  - name: local
  - name: gke
    patches:
      - op: replace
        path: /manifests/kustomize/paths/0
        value: k8s/overlays/gke
