# kagent's stable chart. The values disable its demo fleet and optional MCP servers.
# kagent-chart-version: 0.10.1
#
# v0.10.0 reached GA on 4 September 2026 and v0.10.1 followed on 8 September, which is
# the condition the previous pin was waiting on. The move was taken as one coordinated
# change: both chart digests, the three vendored CRD schemas under infra/kagent/schemas
# (regenerated by scripts/update-kagent-schemas.sh), the controller and UI image digests
# in values.yaml, and the Chapter 6 prose that names the version.
#
# What this release is validated against here: `mise run check:infra` renders every
# overlay, validates all of them against the regenerated v1alpha2 schemas with
# kubeconform -strict, lints them, and confirms the course NetworkPolicy selectors still
# match the labels this chart renders. That is static proof. Nobody has watched this
# control plane come up on k3d against the Go agent — issue #150 tracks that gap, which
# the previous pin shared — so Chapter 6 states it rather than implying otherwise.
# --8<-- [start:kagent-crds-release]
helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 600

releases:
  - name: kagent-crds
    namespace: kagent
    # The reviewed chart is addressed by immutable OCI manifest digest.
    chart: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds@sha256:0b8eacbdc85e21ccad6c008e69ef623428db0be8e45c59492b40f3faff6dcf67
    createNamespace: true
  # --8<-- [end:kagent-crds-release]

  - name: kagent
    namespace: kagent
    # This upstream control-plane chart owns dynamic controller/Postgres labels
    # and ports, so course NetworkPolicies stop at the agentops data plane. A
    # production fork must inventory and policy the pinned chart separately.
    # The reviewed chart is addressed by immutable OCI manifest digest.
    chart: oci://ghcr.io/kagent-dev/kagent/helm/kagent@sha256:dc7fc61090725fd9f860d630a0ca66a1bd2a86d15e3fe267c0467c11cb198403
    createNamespace: true
    needs:
      - kagent/kagent-crds
    values:
      - kagent/values.yaml
