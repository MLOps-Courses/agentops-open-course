# kagent's stable chart. The values disable its demo fleet and optional MCP servers.
# kagent-chart-version: 0.9.12
# --8<-- [start:kagent-crds-release]
helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 600

releases:
