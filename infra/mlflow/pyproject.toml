[project]
name = "agentops-mlflow"
# This environment builds an internal server image, not a published Python
# package; course release identity lives in the OCI label supplied at build time.
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "google-cloud-storage==3.13.0",
  "mlflow==3.16.0",
  "prometheus-flask-exporter==0.23.2",
]

[tool.uv]
package = false
# Force the patched GitPython through MLflow's transitive pin: 3.1.50 carries 8
# HIGH advisories (command injection / clone-option-guard bypass, GHSA-*), all
# fixed by 3.1.54. Trivy fails the release image scan on them until we upgrade.
override-dependencies = ["gitpython>=3.1.54", "cryptography>=50.0.0"]
