apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: agentgateway
  namespace: agentops
  labels:
    app.kubernetes.io/part-of: agentops-open-course
spec:
  provider: OpenAI
  # Open-weight by default, matching values.yaml's providers.openAI.model. The GKE
  # overlay replaces it with the proprietary model, so the substrate that needs an
  # account is the one that asks for it.
  model: qwen3:4b-instruct
  apiKeySecret: agentgateway-client
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://agentgateway.agentops.svc.cluster.local:4000/v1
    timeout: 120
