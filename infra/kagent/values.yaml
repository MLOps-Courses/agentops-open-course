rbac:
  namespaces:
    - kagent
    - agentops

controller:
  image:
    # The chart inserts ':' before tag, so tag@digest preserves the readable
    # version while making the multi-architecture registry index immutable.
    tag: "0.10.1@sha256:878a55478c1727e048d38154158aae41aa701149c6660f78696fe682c7495146"
  watchNamespaces:
    - agentops
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  image:
    tag: "0.10.1@sha256:2c4de55d3ffea5b960a41d667e3cd6b59d64d8da4d6d3ccf528fcd17e6fec4a0"
  replicas: 0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  postgres:
    bundled:
      image:
        tag: "18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7"
      storage: 500Mi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: qwen3:4b-instruct
    apiKeySecretRef: agentgateway-client
    apiKeySecretKey: OPENAI_API_KEY
    apiKey: agentgateway
    config:
      baseUrl: http://agentgateway.agentops.svc.cluster.local:4000/v1

kmcp:
  enabled: false

kagent-tools:
  enabled: false

k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: false
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

grafana-mcp:
  enabled: false

otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: otel-collector.agentops.svc.cluster.local:4317
        protocol: grpc
        insecure: true
