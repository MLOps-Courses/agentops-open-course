apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../agentgateway/k3d
  - prometheus.yaml
  - alertmanager.yaml
  - network-policies.yaml

configMapGenerator:
  - name: prometheus-config
    namespace: agentops
    files:
      - prometheus.yml=prometheus-config.yaml
      # prometheus-rules.yaml is the single source for both alerting planes;
      # infra/observability/prometheus-rules.yml (host Compose) symlinks to it.
      # It has to live here because configMapGenerator rejects a source outside
      # this directory. check-infra.sh asserts the symlink still exists.
      - rules.yml=prometheus-rules.yaml
  - name: alertmanager-config
    namespace: agentops
    files:
      - alertmanager.yml=alertmanager-config.yaml

patches:
  # No ModelConfig patch here: the base already declares qwen3:4b-instruct, and the
  # replacements block below carries that base value into AGENT_MODEL. The GKE
  # overlay owns the override, because it is the one that changes the model.
  # Host Ollama exception: host.k3d.internal resolves to the Docker bridge
  # gateway outside any pod/namespace selector, so the rule must be IP-based.
  # It stays scoped to the Ollama port instead of pinning a bridge CIDR that
  # varies per Docker installation.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: agentgateway-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - port: 11434
              protocol: TCP
  # The co-hosted PII webhook calls Ollama directly. It must not recurse through
  # agentgateway, and the base agent egress stays default-deny for every other port.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: agent-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - port: 11434
              protocol: TCP
  - target:
      group: kagent.dev
      version: v1alpha2
      kind: Agent
      name: agentops-agent
    patch: |-
      - op: add
        path: /spec/byo/deployment/env/-
        value:
          name: AGENT_PII_MODEL_BASE_URL
          value: http://host.k3d.internal:11434/v1

replacements:
  # Select both lists by their semantic names, so reordering either manifest
  # cannot redirect the local model override to another environment variable.
  - source:
      group: kagent.dev
      version: v1alpha2
      kind: ModelConfig
      name: agentgateway
      fieldPath: spec.model
    targets:
      - select:
          group: kagent.dev
          version: v1alpha2
          kind: Agent
          name: agentops-agent
        fieldPaths:
          - spec.byo.deployment.env.[name=^AGENT_MODEL$].value
