apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../agentgateway/gke
  - storage-class.yaml

patches:
  - path: workload-identity.yaml
  # The proprietary model lives here rather than in the base, so an overlay-free
  # `kubectl apply -k infra/kagent` cannot silently select it. The replacements
  # block below carries this value into the agent's AGENT_MODEL.
  - target:
      group: kagent.dev
      version: v1alpha2
      kind: ModelConfig
      name: agentgateway
    patch: |-
      - op: replace
        path: /spec/model
        value: gemini-3.5-flash
  - target:
      version: v1
      kind: PersistentVolumeClaim
      labelSelector: app.kubernetes.io/part-of=agentops-open-course
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: agentops-standard
  # GKE system pods reserve more than one core on a two-core node. Keep the
  # lab's idle requests close to measured usage while retaining burst limits.
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=agentops-open-course
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
  - target:
      group: kagent.dev
      version: v1alpha2
      kind: Agent
      name: agentops-agent
    patch: |-
      - op: replace
        path: /spec/byo/deployment/resources/requests/cpu
        value: 100m
      # Vertex has no local Ollama for the optional named-entity webhook. The
      # deterministic in-process PII layer and GKE gateway rejection stay active.
      - op: add
        path: /spec/byo/deployment/env/-
        value:
          name: AGENT_PII_MODEL_ENABLED
          value: "false"
  # Vertex exception: Google API endpoints publish no stable CIDR, so the
  # rule is port-scoped HTTPS. This cluster uses Calico, whose GKE metadata
  # endpoint requires both TCP 987 and 988 for Workload Identity Federation.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: agentgateway-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 169.254.169.252/32
          ports:
            - port: 987
              protocol: TCP
            - port: 988
              protocol: TCP
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - port: 443
              protocol: TCP
  # Calico evaluates ClusterIP traffic before service translation. Permit the
  # rendered kube-dns service IP as well as the base policy's DNS pod selector.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: dns-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: __GKE_CLUSTER_DNS_IP__/32
          ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP

replacements:
  - source:
      group: kagent.dev
      version: v1alpha2
      kind: ModelConfig
      name: agentgateway
      fieldPath: spec.model
    targets:
      - select:
          group: kagent.dev
          version: v1alpha2
          kind: Agent
          name: agentops-agent
        fieldPaths:
          - spec.byo.deployment.env.[name=^AGENT_MODEL$].value
