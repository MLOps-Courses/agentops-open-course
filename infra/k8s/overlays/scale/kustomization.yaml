apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Horizontal scale for the read plane, layered on the local overlay rather than
# folded into it.
#
# Why a fourth overlay instead of raising `replicas` in base:
#
#  1. The local overlay is the taught path. Its ResourceQuota is sized to the
#     exact steady state a learner runs in Chapter 6, and doubling a workload
#     there would change the pod budget for everyone who never opens 6.9.
#  2. `diff <(kubectl kustomize overlays/local) <(kubectl kustomize overlays/scale)`
#     is itself the lesson: scaling out is a reviewable set of additions, not an
#     edit scattered through the manifests everything else already depends on.
#  3. The GKE overlay must stay single-replica. It runs on multiple nodes, and
#     the shared state claim is ReadWriteOnce — see the volume note below.
#
# What deliberately does NOT scale here, and why it is not an oversight:
# `agentops-agent` stays at one replica. Its A2A task store (`tasks.db`) and its
# published incident database live in AGENT_STATE_DIR, and a2aserver documents
# that process as the single writer of runtime state. Sessions can move to
# PostgreSQL today (Ch. 6.9 proves it); tasks and published state cannot yet.
resources:
  - ../local
  - autoscale.yaml

patches:
  # Two MCP replicas as the floor, so the read path survives losing one pod
  # instead of merely restarting after it. This workload is safe to duplicate:
  # it opens the state volume read-only, publishes nothing, and migrates nothing.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agentops-mcp
    patch: |-
      # The floor is stated once, as `minReplicas` in autoscale.yaml. A
      # `spec.replicas` in an applied manifest and an HPA on the same Deployment
      # contend on every apply: the next `kubectl apply -k` would snap a read
      # plane the autoscaler had taken to three or four back down to the pinned
      # number. The accepted cost is a one-time single-pod window, because a
      # Deployment with no `replicas` defaults to one until the HPA reconciles.
      - op: remove
        path: /spec/replicas
      # Preferred, never required. The state claim is ReadWriteOnce, and the
      # local-path provisioner pins its PersistentVolume to the node that holds
      # the directory — a hard filter the scheduler applies before it scores
      # anything. So on today's single-node cluster both replicas land together
      # and this preference costs nothing, while on a cluster with a
      # ReadWriteMany class it spreads them without ever making a pod unschedulable.
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: agentops-mcp
  # Quota sizing for this overlay = the local overlay's steady state and surge,
  # plus three additional MCP pods (the autoscaler's ceiling of four minus the
  # one the base already counts) and one pod for the Chapter 6.9 PostgreSQL
  # exercise fixture. Local: 13 pod slots, requests 1450m/2880Mi and limits
  # 4200m+2500m/4992Mi+2816Mi including rolling-update surge. Three more MCP
  # pods add 300m/768Mi of requests and 1500m/1536Mi of limits; the exercise
  # adds one pod at 100m/128Mi and 500m/512Mi. The ceilings below sit above that
  # sum so a LimitRange-defaulted debug pod still schedules.
  - target:
      version: v1
      kind: ResourceQuota
      name: agentops-compute
    patch: |-
      - op: replace
        path: /spec/hard/pods
        value: "17"
      - op: replace
        path: /spec/hard/requests.cpu
        value: "3"
      - op: replace
        path: /spec/hard/requests.memory
        value: 5Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "12"
      - op: replace
        path: /spec/hard/limits.memory
        value: 12Gi
