apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-mcp
  namespace: agentops
  labels:
    app.kubernetes.io/name: agentops-mcp
    app.kubernetes.io/part-of: agentops-open-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentops-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-mcp
        app.kubernetes.io/part-of: agentops-open-course
    spec:
      serviceAccountName: agentops-mcp
      # Exceeds the MCP server's own drain window (AGENT_DRAIN_TIMEOUT_S=10) so
      # rotation gives in-flight read tools time to finish before SIGKILL.
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: agentops-agent:dev
          imagePullPolicy: IfNotPresent
          # One image, several surfaces: overriding `args` alone selects the MCP server
          # while leaving the image's own entrypoint (the agent binary) in charge.
          args: ["mcp"]
          env:
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "8000"
            - name: MCP_TRANSPORT
              value: streamable-http
            # The DNS-rebinding allowlist, deliberately narrower than the
            # binary's own DefaultAllowedHosts: the override REPLACES the
            # defaults outright, so naming only agentgateway and agentops-mcp
            # drops the loopback and host.docker.internal entries that exist
            # for the host quickstart and mean nothing in a cluster. 6.4 states
            # this list as the third layer keeping non-gateway callers off
            # :8000, and it stays exact.
            #
            # The cost is real and belongs here rather than in a bug report:
            # `kubectl port-forward svc/agentops-mcp 8000:8000` bypasses the
            # NetworkPolicy, so the Host guard is the only layer left, and a
            # client dialling http://localhost:8000 presents `localhost:8000`
            # and is answered 421. That is the guard working, not a
            # misconfiguration. To load-test or curl the raw server through a
            # port-forward, present an authority that IS on this list — alias
            # it to loopback (`127.0.0.1 agentops-mcp` in /etc/hosts) and point
            # the tool at http://agentops-mcp:8000, which `agentops-mcp:*`
            # matches. Widening this list to make the tool's default URL work
            # would trade the chapter's security property for one less env var.
            - name: MCP_ALLOWED_HOSTS
              value: agentgateway,agentgateway:*,agentgateway.agentops.svc.cluster.local,agentgateway.agentops.svc.cluster.local:*,agentops-mcp,agentops-mcp:*,agentops-mcp.agentops.svc.cluster.local,agentops-mcp.agentops.svc.cluster.local:*
            - name: AGENT_DATA_DIR
              value: /app/data
            - name: AGENT_STATE_DIR
              value: /app/state
          ports:
            - name: mcp
              containerPort: 8000
          # Real HTTP probes (Ch. 6): readiness verifies the agent-owned runtime
          # database through a read-only integrity/schema probe, not merely
          # that a port is open. Startup covers slow first boot so liveness can
          # stay tight.
          #
          # Every probe sets Host explicitly, and it is not optional. The kubelet
          # dials a pod by its address, so an unset Host arrives as `<podIP>:8000`
          # — and the MCP server's DNS-rebinding guard refuses any authority not
          # on MCP_ALLOWED_HOSTS with 421, probes included and on purpose (see
          # Server.guardAuthority: a probe that answered on any authority would
          # confirm to an attacker's page that this server exists and is healthy).
          # A pod IP cannot be allowlisted in advance, so the probe names an
          # authority that can be: the Service FQDN already on the list. Without
          # these three headers every probe fails 421 and the container restarts
          # forever, on any cluster.
          startupProbe:
            httpGet:
              path: /livez
              port: mcp
              httpHeaders:
                - name: Host
                  value: agentops-mcp.agentops.svc.cluster.local
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
              httpHeaders:
                - name: Host
                  value: agentops-mcp.agentops.svc.cluster.local
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: mcp
              httpHeaders:
                - name: Host
                  value: agentops-mcp.agentops.svc.cluster.local
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /app/state
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: agentops-agent-state
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agentops-mcp
  namespace: agentops
  labels:
    app.kubernetes.io/name: agentops-mcp
    app.kubernetes.io/part-of: agentops-open-course
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentops-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
