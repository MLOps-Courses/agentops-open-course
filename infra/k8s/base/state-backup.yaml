# Nightly online-safe snapshot of the agent state (sessions, A2A tasks, and
# the append-only audit trail) into a second PVC. Uses the same repository-owned
# state CLI as the host scripts, so there is one snapshot format and no plain
# `cp` of a live database. A backup PVC in the same single-node cluster
# is crash/mistake recovery for the lab, not disaster recovery, and
# `skaffold delete` removes both PVCs together.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentops-state-backup
  namespace: agentops
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentops-state-backups
  namespace: agentops
  labels:
    app.kubernetes.io/name: agentops-state-backup
    app.kubernetes.io/part-of: agentops-open-course
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentops-state-backup
  namespace: agentops
  labels:
    app.kubernetes.io/name: agentops-state-backup
    app.kubernetes.io/part-of: agentops-open-course
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agentops-state-backup
        app.kubernetes.io/part-of: agentops-open-course
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agentops-state-backup
            app.kubernetes.io/part-of: agentops-open-course
        spec:
          serviceAccountName: agentops-state-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: agentops-agent:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "agent.state", "backup"]
              # The CLI uses sqlite3.Connection.backup, validates every copied
              # database, records a hashed versioned manifest, then atomically
              # publishes the generation. Retention keeps 7 complete snapshots.
              args:
                - --state-dir
                - /app/state
                - --backup-root
                - /backups
                - --keep
                - "7"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: state
                  mountPath: /app/state
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: agentops-agent-state
            - name: backups
              persistentVolumeClaim:
                claimName: agentops-state-backups
